    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background: #f4f1ea;
    }

    #map {
      height: 100dvh;
      width: 100%;
    }

    /* Riduce attributi Leaflet riferito ad OpenStreetMap */
    .leaflet-control-attribution {
      font-size: 8px;               /* più piccolo */
      opacity: 0.5;                 /* meno invadente */
      background: rgba(255,255,255,0.3);     /* leggermente trasparente */
      padding: 2px 2px;
    }

    /* Stile Popup Informativi leaflet */
    .leaflet-popup-content-wrapper {
      padding: 2px 0;
    }

    .leaflet-popup-content {
      margin: 4px 6px;
    }

    #fx-canvas {
      position: absolute;
      top: 0;
      left: 0;
      height: 100dvh;
      width: 100%;
      pointer-events: none;     /* Non blocca i click sulla mappa */
      z-index: 9999;
    }
    
    /* Titolo */
    .title {
      font-size: 22px;
      color: #3b82f6;
      letter-spacing: 1px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 1px;
      height: 35px;
    }

    .title span {
      display: inline-block;
    }

    .title span:nth-child(1) { transform: translateY(8px) rotate(-18deg); }
    .title span:nth-child(2) { transform: translateY(4px) rotate(-12deg); }
    .title span:nth-child(3) { transform: translateY(1px) rotate(-6deg); }
    .title span:nth-child(4) { transform: translateY(0px); }
    .title span:nth-child(5) { transform: translateY(1px) rotate(6deg); }
    .title span:nth-child(6) { transform: translateY(4px) rotate(12deg); }
    .title span:nth-child(7) { transform: translateY(8px) rotate(18deg); }

    .map-overlay,
    .map-overlay2,
    .top-timebar,
    .copyright,
    #eventTicker {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
    }
    
    /* Sotto titolo */
    .subtitle {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 18px;
      margin-top: 2px;
      font-size: 12px;
      color: #6b6b6b;
    }

    /* -- Rettangolo Aroundo trasparente */
    .map-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      padding: 20px;
      border-radius: 50%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.9), rgba(255,255,255,0.8));
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);     /* Velocità */ 
    }

    /* stato “mini” in alto a destra */
    .map-overlay.minimized {
      top: 18px;
      right: 2px;
      left: auto;
      transform: none;
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
      overflow: hidden;
    }

    /* icona toggle */
    #overlayToggle {
      position: fixed;
      top: 18px;
      right: 2px;
      z-index: 1000;
      width: 32px;
      height: 32px;
      display: none;
      background: #3b82f6;
      color: white;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* -- Rettangolo filtro categorie */
    .map-overlay2 {
      position: absolute;
      top: 2px;
      left: 2px;
      z-index: 999;
      background: linear-gradient(to bottom, rgba(255,255,255,0.25), rgba(255,255,255,0.1));
      padding: 2px 2px;     /* Contenitore */
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      min-width: 140px;
      width: fit-content;
      max-width: 200px;
      max-height: 60vh;     /* limita altezza della sezione in verticale */
      overflow-y: auto;     /* scroll verticale se tante categorie */
    }
      
    /* -- Rettangolo barra temporale */
    .top-timebar {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);   /* centraggio reale */
      z-index: 998;
      display: flex;
      flex-direction: row;           /* elementi in riga su desktop */
      align-items: center;
      justify-content: center;       /* centrare internamente */

      width: 310px;
      height: 90px;
      padding: 2px 2px;
      border-radius: 50px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.25), rgba(255,255,255,0.08));
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    /* Pallino torna alla data di oggi */
    .reset-btn {
      border: none;
      background: transparent;
      font-size: 32px;
      cursor: pointer;
      color: #3b82f6;
      padding: 6px 10px;
      border-radius: 10px;
      font-weight: bold;
      transition: background-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .reset-btn:hover {
      background: rgba(59, 130, 246, 0.08);
      transform: translateY(-2px) scale(1.12);
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .reset-btn:active {
      transform: translateY(0px) scale(0.96);
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    /* --- MENU & FILTRI --- */
    /* -- Menù a discesa */
    .menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      margin-bottom: 4px;
      width: 130px;       /* larghezza */
    }

    /* Elementi del menu */ 
    #menu-items {
      max-height: 72vh;
      overflow-y: auto;
    }

    /* elementi in verticale */
    .vertical-toggles {
      display: flex;
      flex-direction: column;
      width: 140px;     /* largezza massima della riga */
      gap: 3px;         /* Distanzia le singole categorie in verticale */
    }
    
    /* checkbox Seleziona Categorie */
    .toggle-pill {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 28px;
        min-height: 28px;
        padding: 0;
        border: none;
        background: transparent;
        cursor: pointer;
        user-select: none;
        position: relative;
        flex-shrink: 0;
    }

    .toggle-pill::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: white;
      box-shadow: inset 0 0 0 3px #0d6efd;
    }

    .toggle-pill:has(.toggle-checkbox:checked)::after {
      content:"";
      position:absolute;
      width:12px;
      height:12px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius:50%;
      background:#0d6efd;
    }

    .toggle-pill.partial::after {
      content:"";
      position:absolute;
      width:4px;
      height:4px;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      border-radius:50%;
      background:#0d6efd;
    }
    
    /* Checkbox Categorie */
    .category-checkbox {
      position: absolute;
      background: transparent;
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .toggle-checkbox {
      display: none;
    }
    
    /* Label delle categorie */
    .category-label {
      white-space: nowrap;
      display: flex;
      align-items: center;          /* icona e testo allineati in alto */
      justify-content: flex-start;  /* testo a sinistra */
      margin: 2px;                  /* distanza verticale compatta */
      cursor: pointer;
      border-radius: 50px;
      padding: 1px 4px;     /* leggero padding */
      flex-grow: 1;         /* permette all'hover di utilizzare tutta la larghezza */ 
      font-size: 12px;
      color: #fff;
      font-weight: 500;
      user-select: none;
      transition: opacity 0.2s;
    }

    /* Cerchietto prima del testo */
    .category-label::before {
      content: '';
      display: inline-block;
      width: 14px;
      height: 14px;
      flex: 0 0 14px; /* impedisce lo schiacciamento */
      border-radius: 50%;
      margin-right: 2px;
      border: 2px solid white;
      box-sizing: border-box;
      background: transparent;
      transition:
        background 0.2s ease,
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    /* Categoria disattiva */
    .category-checkbox:not(:checked) + .category-label {
      opacity: 0.75;
    }

    /* Pallino categoria disattiva */
    .category-checkbox:not(:checked) + .category-label::before {
      background: white;
     }
      
    /* PULSAZIONI dei Marker */
    /* Marker pulsazioni base */
    .pulse { border-radius: 50%; position: relative; z-index: 990; }
    .pulse::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--c); z-index: 990; }
    .pulse::after { content: ""; position: absolute; inset: -30%; border-radius: 50%; background: var(--c); z-index: 991; opacity: 0.25; transform: scale(0.6); }
    /* Marker pulsazioni in funzione del tempo */
    .pulse.distant { animation: none; }
    .pulse.distant::after { animation: none; opacity: 0; }    
    .pulse.future-deep { animation: none; }
    .pulse.future-deep::after { animation: none; opacity: 0; }    
    .pulse.future-far { animation: hopSlow 3s infinite; }
    .pulse.future-medium { animation: hopMedium 2s infinite; }
    .pulse.future-near { animation: hopFast 1s infinite; }
    .pulse.imminent { animation: hopCrazy 0.5s infinite; }
    .pulse.imminent::after { animation: pulse 0.5s infinite ease-out; }
    .pulse.countdown { animation: hopCrazy 0.3s infinite; }
    .pulse.countdown::after { animation: pulse 0.3s infinite ease-out; }
    .pulse.started { animation: hopLive 2s infinite; }    
    .pulse.started::after { animation: pulseLive 0.3s infinite; }
    .pulse.running-strong { animation: running-strong 2s infinite ease-in-out;}
    .pulse.running-strong::after { animation: pulse 2s infinite ease-out; }
    .pulse.running-medium { animation: running-medium 2.5s infinite ease-in-out;}
    .pulse.running-medium::after { animation: hopSlow 2.5s infinite; opacity: 0.12;}
    .pulse.running-soft { animation: running-soft 3s infinite ease-in-out;}
    .pulse.running-soft::after { animation: none; opacity: 0;}
    .pulse.running { animation: none; }
    .pulse.running::after { animation: pulse 2.5s infinite ease-out; }
    .pulse.finished { animation: finished 0.5s ease forwards; }    
    /* Inserisce un piccolo puntino bianco sui markers conclusi */
    .pulse.finished::after { content: ""; position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #ffffff; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1001; opacity: 0.9;}

    /* SALTI dei Marker correlati alle Pulsazioni */
    @keyframes pulse { 0% { transform: scale(0.6);opacity: 0.5; } 70% { transform: scale(1.6); opacity: 0; } 100% { opacity: 0; }}
    @keyframes hopSlow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); }}
    @keyframes hopMedium { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); }}
    @keyframes hopFast { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); }}
    @keyframes hopCrazy { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); }}
    @keyframes pulseLive { 0% { transform: scale(1) translateY(0); opacity: 0.7; } 70% { transform: scale(1.5) translateY(-5px); opacity: 0.3; } 100% { transform: scale(2) translateY(-10px); opacity: 0; }}
    @keyframes running-strong { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-8px,0); } /* X = -8px, Y = 0 */}
    @keyframes running-medium { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-6px,0); } /* X = -8px, Y = 0 */}
    @keyframes running-soft { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-4px,0); } /* X = -8px, Y = 0 */}
    @keyframes finished { 0%,100% { transform: translateY(0); }}

    /* Mette in maiuscolo la prima lettera della stringa: "lun" → "Lun" */

    /* Aggiorna le informazioni testuali della timeline: data, giorno della settimana e posizione dei giorni nella modalità live/day.
       Richimata da: DOM; visibilitychange. Listener: prev-day; next-day; reset-day */
    function updateDateUI() {
      dayText.innerText = currentDate.getDate();
      dateText.innerText = monthNames[currentDate.getMonth()] + " " + currentDate.getFullYear();

    if (timelineMode === 'live') {
      const currentDayPercent = midnightPercent / 2;
      const nextDayPercent = midnightPercent + (1 - midnightPercent) / 2;
      // Giorno attuale

      currentDayName = capitalizeFirst(currentDayName);
      currentDayEl.innerText = `${currentDayName} ${currentDate.getDate()}`;
      currentDayEl.style.left = `${currentDayPercent * 100}%`;
      currentDayEl.style.display = "block";
      currentDayEl.style.transform = "";
      // Giorno successivo
      const nextDate = new Date(currentDate);
      nextDate.setDate(currentDate.getDate() + 1);
      let nextDayName = nextDate.toLocaleDateString(navigator.language, { weekday: 'short' });
      nextDayName = capitalizeFirst(nextDayName);
      nextDayEl.innerText = `${nextDayName} ${nextDate.getDate()}`;
      nextDayEl.style.left = `${(nextDayPercent - 0.10) * 100}%`; // tolgo il 10% per compensare in allineamento la dimensione dei caratteri
      nextDayEl.style.display = "block";

    /* Ricrea lo slider temporale in base alla modalità corrente.
      Azioni: distrugge l'eventuale slider precedente, calcola il range temporale, ricrea lo slider e calcola/imposta la posizione dell'indicatore di mezzanotte o lo nasconde.
      Chiamata da: inizializzazione; navigazione giorno (prev/next); reset giorno; rientro nella pagina. */
    function setupTimeline() {
      // distrugge vecchio slider per ricrearlo da zero
      if (slider.noUiSlider) {
      slider.noUiSlider.destroy();
      slider.noUiSlider = null;
      }
      const { start, end } = getTimelineRange();
      // ore totali reali del range
      totalHours = Math.ceil((end - start) / 3600000);
      // Controllo di sicurezza per evitare errori.
      if (!totalHours || isNaN(totalHours)) {console.error("Invalid timeline range", totalHours);
      return;
      }
      // Crea lo slider con doppia maniglia
      noUiSlider.create(slider, {start: [0, totalHours], connect: true, step: 1, range: { min: 0, max: totalHours }});
      // Ad ogni movimento dello slider agiorna la mappa
      slider.noUiSlider.on('update', updateHandles);
      // Calcola posizione mezzanotte (0.0 Sinistra ; 0.5 Centro ; 1.0 Destra) e la trasforma in Percentuale (0%; 50%; 100%)
      const midnight = document.getElementById('midnight');
      // Calcola la posizione della mezzanotte rispetto al range temporale live.
      if (timelineMode === 'live') {
        const currentHour = new Date().getHours();
        const remainingToday = 24 - currentHour;
        midnightPercent = remainingToday / totalHours;
      midnight.style.display = "block"; 
      midnight.style.left = `${midnightPercent * 100}%`;
      } else {
      // Nasconde l'indicatore di mezzanotte in modalità day/past.
      midnight.style.display = "none";
      }
    }

    /* Calcola il range temporale della timeline.
       Azioni: determina data/ora di inizio e fine in base a timelineMode: live = ora corrente → fine di domani; past/day = 00:00 → 23:59 del giorno selezionato.
       Chiamata da: setupTimeline(); updateMarkerVisibility(). */
    function getTimelineRange () {
      let start, end;
      if (timelineMode === 'live') {
        start = getAppTime('live'); // Ora corrente
        end = new Date(start);
        end.setDate(end.getDate() + 1) ; // Domani
        end.setHours(23, 59, 59, 999);  // fine giornata domani
        } else {
        start = getAppTime('startOfDay'); // Inizio Giorno
        end = getAppTime('endOfDay'); // Fine Giorno
        }
        return { start, end };
    }
  
    /* Restituisce una data/ora di riferimento.
       Modalità: startOfDay, endOfDay, live o ora corrente sul giorno logico.
       Chiamata da: getTimelineRange(), updateHandles(), getUpcomingEvents(). */
    function getAppTime(mode = 'now') {
      const day = new Date(currentDate);
      let time = new Date();
      switch(mode) {case 'startOfDay': time = new Date(day); time.setHours(0,0,0,0); break;
          case 'endOfDay': time = new Date(day); time.setHours(23,59,59,999); break; // fine della giornata logica.
          case 'live': time = new Date(); break; // ora corrente entro il giorno logico
          default: const now = new Date(); time = new Date(day); time.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), 0);
          }
      return time;
    }
  
    /* GESTIONE TIMELINE:
    Determina la modalità della timeline in base alla data selezionata:
     - past = giorno precedente a oggi 00-24.
     - live = oggi+domani, timeline inizia dall'ora corrente fino alle 24 più tutta la giornata completa di domani 00-24.
     - day  = giorno successivo ad oggi, 00-24
    Chiamata da: prev-day (mode=past); next-day (mode=day); reset-day (mode=today); visibilitychange; 
     */
    function updateTimelineMode() {
      const currentDay = new Date(currentDate);
      currentDay.setHours(0,0,0,0);
      const today = new Date();
      today.setHours(0,0,0,0);
      const diffDays = Math.round((currentDay - today) / 86400000);
      if (diffDays < 0) {timelineMode = 'past';
      } else if (diffDays === 0) {timelineMode = 'live';
      } else {timelineMode = 'day';
      }
    }

    /* Aggiorna le etichette delle maniglie e il filtro temporale dei marker.
       Azioni: converte gli offset dello slider in date/ore reali, aggiorna le etichette e applica il range alla visibilità dei marker.
       Chiamata da: setupTimeLine() come callback dell'evento 'update' dello 'slider'. */
    function updateHandles(values) {
      // Offset
      const startOffset = Math.round(values[0]);
      const endOffset = Math.round(values[1]);
      // baseTime coerente con la modalità timeline
      const baseTime = getAppTime(timelineMode === 'live' ? 'live' : 'startOfDay');
      const startDate = new Date(baseTime.getTime() + startOffset * 3600000);
      const endDate = new Date(baseTime.getTime() + endOffset * 3600000);
      // Crea le etichette delle maniglie
      const formatTime = (date) =>
      date.getHours().toString().padStart(2,'0'); // + ':' + date.getMinutes().toString().padStart(2,'0');
      const startLabel = formatTime(startDate);
      const endLabel   = formatTime(endDate);
      const handles = slider.querySelectorAll('.noUi-handle');
      handles.forEach((h, i) => {let label = h.querySelector('.handle-label');
        if (!label) {
          label = document.createElement('div');
          label.className = 'handle-label';
          h.appendChild(label);
        }
      // Inserisce ora di inizio e di fine
      label.innerText = i === 0 ? startLabel : endLabel;
    });
    updateMarkerVisibility(startDate,endDate);
  }

  // Preleva gli Eventi ed Organizzatori da supabase

    /* Funzione prevista da MODIFICARE con la nuova logica */
    /* RICOSTRUISCE I MARKER — ricrea la rappresentazione grafica di tutti gli eventi.
       Azioni: rimuove i marker esistenti, calcola lo stato degli eventi, crea e registra i nuovi marker, 
       collega popup/spiderizzazione, aggiorna i fireworks e applica il filtro temporale finale.
       Chiamata da: DOM; next-day (mopde=day); prev-day (mode=live e mode=past); reset-day; visibilitychange; setinterval fetchEvents 30'; setinterval updateMarkerVisibility 2'.*/
    function renderEvents() {
      // pulizia markers precedenti
      markers.forEach(m => {
      // ferma eventuali fireworks attivi
      if (m.marker.fireworkInterval) {
        clearInterval(m.marker.fireworkInterval);
        m.marker.fireworkInterval = null;
      }
      markersCluster.removeLayer(m.marker);
      });
      markers = [];
      events.sort((a, b) => new Date(a.ev_inizio) - new Date(b.ev_inizio));
      events.forEach(e => {
        const stateData = getEventState( new Date(e.ev_inizio), e.ev_fine ? new Date(e.ev_fine) : null);
        const stateClass = stateData.state;
        // 🎨 ICONA
        const marker = L.marker([e.luoghi.lu_lat, e.luoghi.lu_lng], {
          icon: createIcon(categories.find(c => c.id_categoria === e.id_categoria)?.mc_colore || '#999', stateClass)
        })
        markersCluster.addLayer(marker); // Visualizzazione/Gestione dei marker
        updateMarkerState(marker, stateClass, {lat: e.luoghi?.lu_lat, lng: e.luoghi?.lu_lng}); // Effetti grafici e Fuochi d'artificio
        marker.on('click', function () {analyticsMarker();
        window.openBasePopup(e, this.getLatLng());});
        markers.push({ marker, category: parseInt(e.id_categoria), start: new Date(e.ev_inizio), end: e.ev_fine ? new Date(e.ev_fine) : null,});
      });
    }

    /* Funzione prevista da CANCELLARE con la nuova logica */
    // Dimensione, Classe e Colore dei Markers  
    function createIcon(color, state) {
      const size = markerSizes[state] || 10;
      return L.divIcon({ className: '', html: `<div class="pulse ${state}" style="--c:${color};width:${size}px;height:${size}px;"></div>`,
      iconSize: [size, size]
      });
    }

    /* Funzione prevista da MODIFICARE con la nuova logica */
    /* FILTRA I MARKER — determina quali marker devono essere visibili.
       Azioni: ricava categorie attive, verifica sovrapposizione temporale
       e aggiunge/rimuove i marker dal cluster; arresta eventuali fireworks
       dei marker nascosti.
       Chiamata da: updateHandles(), renderEvents(), filtro categorie. */
    function updateMarkerVisibility(start, end) {
      // Se non vengono passati parametri, usa il range corrente della timeline
      if (!start || !end) {
      const range = getTimelineRange();
      start = range.start;
      end = range.end;
      }
      const checkboxes = document.querySelectorAll('#menu-items input[type="checkbox"]');
      const activeCategories = [];
      checkboxes.forEach(cb => {const catId = parseInt(cb.id.replace('cat-', ''));
      if (cb.checked) { activeCategories.push(catId); }});
      // Preleva eventStart ed eventEnd dai markers      
      markers.forEach(marker => {
      const categoryVisible = activeCategories.includes(marker.category);
      const eventStart = new Date(marker.start);
      const eventEnd = marker.end ? new Date(marker.end) : eventStart;
      // Seleziona il range dei markers da visualizzare tra eventStart ed eventEnd
      const inTimeRange = eventStart <= end &&  eventEnd >= start;
      // disattiva il timeriterval del marker per i fireworks
        const visible = categoryVisible && inTimeRange;
          if (visible) {markersCluster.addLayer(marker.marker);
            updateMarkerState(
              marker.marker,
              marker.marker.state,
              marker.marker.getLatLng()
              );
          } else {
            markersCluster.removeLayer(marker.marker);
            if (marker.marker.fireworkInterval) {
              clearInterval(marker.marker.fireworkInterval);
              marker.marker.fireworkInterval = null;
            }
          }
        });
    }

          arrow.textContent = isOpen ? '▲' : '▼';
          // Apertura Menu: Se Tutte le categorie sono selezionate, le deseleziona tutte, altrimenti lascia la selezione corrente.
          if (isOpen && selectAllToggle.checked) {
            const checkboxes = menuItemsDiv.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = false);
            selectAllToggle.checked = false;
            updateMarkerVisibility();
          }            
          // Chiusura menu: Se Nessuna categoria è selezionata, le seleziona tutte, altrimenti lascia la selezione corrente
          if (!isOpen) {
            const checkboxes = menuItemsDiv.querySelectorAll('input[type="checkbox"]');
            const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
              if (checkedCount === 0) {
              checkboxes.forEach(cb => cb.checked = true);
              selectAllToggle.checked = true;
              updateSelectAllToggle();
              updateMarkerVisibility();
              }
            }
        });
        // Checkbox Singola Categoria
        menuItemsDiv.addEventListener('change', () => updateMarkerVisibility());
        const selectAllToggle = document.getElementById('select-all-toggle');
        selectAllToggle.checked = true;
        // Checkbox Globale Seleziona/Deseleziona
        selectAllToggle.addEventListener('change', () => {
        const checkboxes = menuItemsDiv.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(cb => cb.checked = selectAllToggle.checked);
        updateSelectAllToggle();
        updateMarkerVisibility();
        });
        // aggiorna lo stato del checkbox
        function updateSelectAllToggle() {
        const checkboxes = document.querySelectorAll('#menu-items input[type="checkbox"]');
        const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
        const allChecked = checkedCount === checkboxes.length;
        const partialChecked = checkedCount > 0 && checkedCount < checkboxes.length;  
        selectAllToggle.checked = allChecked;
        selectAllToggle.parentElement.classList.toggle('partial', partialChecked);  
        }
        menuItemsDiv.addEventListener('change', updateSelectAllToggle);
      // Chiude l'elenco delle categorie facendo un click fuori. 
      document.addEventListener('click', (event) => {
      if (
        menuItemsDiv.classList.contains('open') &&
        !menuItemsDiv.contains(event.target) &&
        !toggleBtn.contains(event.target)
      ) {
        menuItemsDiv.classList.remove('open');
        menuItemsDiv.style.display = 'none';
        arrow.textContent = '▼';
        // Mantiene la tua logica di chiusura
        const checkboxes = menuItemsDiv.querySelectorAll('input[type="checkbox"]');
        const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
        if (checkedCount === 0) {
          checkboxes.forEach(cb => cb.checked = true);
          selectAllToggle.checked = true;
          updateSelectAllToggle();
          updateMarkerVisibility();
        }
      }
    });
 }

       Chiamata da: popup evento; popup dettagli; ticker. */
    function formatTime(dateString) {

      return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

    /* Funzione prevista da CANCELLARE con la nuova logica */
    /* Determina lo stato temporale di un evento rispetto all'ora attuale.
       Azioni: calcola distanza dall'inizio e durata; assegna lo stato del marker (futuro, countdown, in corso o terminato).
       Chiamata da: renderEvents(). */
    function getEventState(startDate, endDate) {
      const now = new Date();
      const diffMinutes = (startDate - now) / 1000 / 60;
      const minutesFromStart =  (now - startDate) / 1000 / 60;
      const durationMinutes = endDate ? (endDate - startDate) / 1000 / 60 : null; // calcola durata dell'evento
      // evento terminato 
      if (endDate && now > endDate) return {state: 'finished' };
      /* evento partito */
      if (minutesFromStart > 0) {
      if (durationMinutes) {
        const progress = minutesFromStart / durationMinutes;
          if (progress < 0.125) return { state: 'running-strong' };
          if (progress < 0.25)  return { state: 'running-medium' };
          if (progress < 0.5)   return { state: 'running' };
        }
        return { state: 'running-soft' };
      }
      // Inizia tra +12 - 8 - 4 - 2 - 1h - 30' - 0' - Started 
      if (diffMinutes > 720) return { state: 'distant' };
      if (diffMinutes > 480) return { state: 'future-deep' };
      if (diffMinutes > 240) return { state: 'future-far' };
      if (diffMinutes > 120) return { state: 'future-medium' };
      if (diffMinutes > 60) return { state: 'future-near' };
      if (diffMinutes > 30) return { state: 'imminent' };
      if (diffMinutes > 0) return { state: 'countdown' };
      return { state: 'started' };
  }

    /* Verifica se la geolocalizzazione è disponibile.
       Azioni: richiede una posizione GPS; aggiorna lo stato visivo in base all'esito.
       Chiamata da: caricamento pagina; rientro nella pagina. */
    function checkGeoStatus() {
      navigator.geolocation.getCurrentPosition(
        (pos) => {updateGeoStatus(true);},
        () => {updateGeoStatus(false);},
        { timeout: 5000 });
    }

    /* Acquisisce la posizione dell'utente e aggiorna la mappa.
       Azioni: richiede il GPS, registra l'esito, aggiorna lo stato GPS, calcola la densità degli eventi vicini e centra/scala la mappa.
       Chiamata da: click su geoStatus quando la posizione non è disponibile. */
  function requestUserLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
          (pos) => {
          const userLat = pos.coords.latitude;
          const userLng = pos.coords.longitude;
          analyticsGPS(true, userLat, userLng);
          updateGeoStatus(true);
          // Calcolo approssimativo dello zoom in base agli eventi vicini
          const nearbyEvents = events.filter(e => {
          const distance = map.distance([userLat, userLng], [e.luoghi.lu_lat, e.luoghi.lu_lng]);
          return distance <= 25000; // 25 km
          });
          let zoomLevel = 10; // Provincia
          if (nearbyEvents.length > 100) zoomLevel = 11; // Comune
          else if (nearbyEvents.length > 50) zoomLevel = 10; // Provincia
          else zoomLevel = 9; // Regione
          map.setView([userLat, userLng], zoomLevel);
          },
          (err) => {
            if(err.code === 1){
              analyticsGPS(false); // Utente ha rifiutato
            }else{
              analyticsGPS(null); // Stato non determinabile
            }
            updateGeoError();
            map.setView([defaultLat, defaultLng], defaultZoom);
            });
        } else {
          analyticsGPS(null); // Geolocalizzazione non disponibile
          updateGeoError();
          map.setView([defaultLat, defaultLng], defaultZoom);
        }
      }

    /* Determina il colore del testo in base al colore di sfondo.
       Azioni: calcola la luminosità del colore e restituisce nero o bianco
       per garantire un contrasto leggibile.
       Chiamata da: buildCategoryMenu(), per ogni categoria. */
  function getContrastColor(hex) {
      hex = hex.replace('#', '');
      const r = parseInt(hex.substr(0,2),16);
      const g = parseInt(hex.substr(2,2),16);
      const b = parseInt(hex.substr(4,2),16);
      const brightness =
      (r * 299 + g * 587 + b * 114) / 1000;
      return brightness > 150
      ? '#111'
      : '#fff';
    }

    const list = getUpcomingEvents(12).slice(0, 20); // Eventi nelle prossime 12 ore, massimo 20 elementi.
    const html = list.map(e => {

    /* Seleziona gli eventi imminenti entro un intervallo temporale.
       Azioni: determina l'ora di riferimento, calcola il limite temporale, filtra gli eventi futuri e li ordina per orario di inizio.
       Chiamata da: updateTicker().*/
    function getUpcomingEvents(hours = 12) { // 12 ore come valore predefinito; il chiamante può specificare un intervallo diverso.
      const now = timelineMode === 'live'
        ? getAppTime('live')
        : getAppTime('startOfDay');
      const limit = new Date(now);
      limit.setHours(limit.getHours() + hours);    
      return events.filter(e => {
        const start = new Date(e.ev_inizio);
        return start > now && start <= limit;
      }).sort((a,b)=>
        new Date(a.ev_inizio) - new Date(b.ev_inizio)
      );
    }

    /* Converte coordinate geografiche in coordinate del canvas.
       Azioni: converte lat/lng nelle coordinate x/y relative alla mappa.
       Chiamata da: triggerFirework(). */
    function latLngToCanvasXY(lat, lng) {
      const point = map.latLngToContainerPoint([lat, lng]);
      return { x: point.x, y: point.y };
    }

    /* Inizializza una particella del fuoco d'artificio.
       Azioni: memorizza posizione, colore, velocità e durata e inizializza i parametri grafici della particella.
       Chiamata da: Firework.createParticles(). */
    class Particle {
      constructor(x, y, color, vx, vy, life) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = vx;
        this.vy = vy;
        this.life = life;
        this.alpha = 1;
        this.radiusOuter = 4; // dimensione stellina
        this.radiusInner = 2;
        this.spikes = 5; // punte della stella
      }

    /* Aggiorna lo stato fisico della particella.
       Azioni: aggiorna posizione, gravità, durata e trasparenza.
       Chiamata da: Firework.update(). */
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += 0.05; // gravità
      this.life -= 1;
      this.alpha = Math.max(0, this.life / 60);
    }

  /* Disegna la particella sul canvas.
     Azioni: applica trasparenza/colore e disegna la stella.
     Chiamata da: Firework.draw(). */
    draw(ctx) {
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = this.color;
      ctx.translate(this.x, this.y);
      ctx.beginPath();
      for (let i = 0; i < this.spikes * 2; i++) {
        const r = i % 2 === 0 ? this.radiusOuter : this.radiusInner;
        const angle = (Math.PI / this.spikes) * i;
        const px = Math.cos(angle) * r;
        const py = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }  
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

    /* Inizializza un fuoco d'artificio.
       Azioni: imposta posizione, traiettoria, stato di esplosione, particelle e parametri grafici.
       Chiamata da: triggerFirework(). */
class Firework {
  constructor(x, y) {
    this.x = x; // coordinata orizzontale
    this.y = y; // posizione iniziale
    this.startY = y; // quota di partenza
    this.maxHeight = 26; // quota massima raggiungibile
    this.particles = []; // perticelle dopo esplosione
    this.exploded = false; // esploso si/no
    this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
    this.vy = -8 - Math.random() * 3; // velocità verticale
    this.vx = (Math.random() - 0.5) * 2; // deriva laterale
    this.currentY = y; // quota corrente
    this.trail = []; // punti della scia
  }

  /* Verifica se il fuoco d'artificio è terminato.
     Azioni: restituisce true quando è esploso e non ha più particelle.
     Chiamata da: animateFX(). */
  isDead() { return this.exploded && this.particles.length === 0;}

  /* Aggiorna lo stato del fuoco d'artificio.
     Azioni: aggiorna il razzo durante la salita, gestisce l'esplosione, aggiorna le particelle e rimuove quelle terminate.
     Chiamata da: animateFX(). */
  update() {
    if (!this.exploded) {
      this.x += this.vx; 
      this.currentY += this.vy; // Salita del razzo
      this.vy += 0.35; // gravità
      this.trail.push({ x: this.x, y: this.currentY }); 
      if (this.trail.length > 4) this.trail.shift(); // quanti punti di scia vengono mantenuti 
      // esplode quando raggiunge maxHeight o inizia la discesa
      if (this.startY - this.currentY >= this.maxHeight || this.vy >= 0) { this.exploded = true; this.createParticles(); } 
    }
    this.particles.forEach(p => p.update()); // aggiorna le particelle esplose
    this.particles = this.particles.filter(p => p.life > 0); // elimina particelle morte
  }

  /* Crea le particelle dell'esplosione.
     Azioni: genera particelle con direzione, velocità, colore e durata casuali.
     Chiamata da: Firework.update(). */
  createParticles() {
    const count = 10 + Math.floor(Math.random() * 10); // Numero di stelline che esplodono
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * 2 * Math.PI;
      const speed = Math.random() * 4 + 2;
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      const color = `hsl(${Math.random() * 360}, 100%, 50%)`;
      this.particles.push(
        new Particle(this.x, this.currentY, color, vx, vy, 30 + Math.random() * 20) // Quanti frame vive una particella
      );
    }
  }

  /* Disegna il fuoco d'artificio sul canvas.
     Azioni: disegna scia, razzo e particelle esplose.
     Chiamata da: animateFX(). */
  draw(ctx) {
    ctx.save();
    for (let i = 0; i < this.trail.length; i++) {
      const p = this.trail[i];
      ctx.globalAlpha = i / this.trail.length * 0.25; // opacità crescente verso il razzo ( 1 = Opaco 0.5= semi trasparente 0 = invisibile)
      ctx.fillStyle = this.color; // colore della scia
      ctx.beginPath(); // disegna punto luminoso
      ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    // Razzo prima dell’esplosione
    if (!this.exploded) {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.currentY, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    // Stelline esplose
    this.particles.forEach(p => p.draw(ctx));
  }
  }
  
  /* Avvia un nuovo fuoco d'artificio nella posizione indicata.
     Azioni: converte la posizione geografica in coordinate canvas e crea un nuovo Firework.
     Chiamata da: updateMarkerState(). */
  function triggerFirework(latLng) {
  const { x, y } = latLngToCanvasXY(latLng.lat, latLng.lng);
  fireworks.push(new Firework(x, y));
}

  /* Esegue il ciclo di animazione dei fireworks.
     Azioni: pulisce il canvas, aggiorna e disegna tutti i fireworks, elimina quelli terminati e richiede il frame successivo.
     Chiamata da: avvio dello script; richiama sé stessa tramite requestAnimationFrame(). */
function animateFX() {ctx.clearRect(0, 0, canvas.width, canvas.height);
  fireworks.forEach(fw => {fw.update(); fw.draw(ctx);});
    // elimina fuochi terminati
  for (let i = fireworks.length - 1; i >= 0; i--) {if (fireworks[i].isDead()) {fireworks.splice(i, 1);}
  }
requestAnimationFrame(animateFX);
}
animateFX();

    /* Funzione prevista da CANCELLARE con la nuova logica */
    /* Aggiorna lo stato visivo e i fireworks del marker.
       Azioni: imposta lo stato e avvia/interrompe i fireworks in base allo stato ricevuto.
       Chiamata da: renderEvents().*/
    function updateMarkerState(marker, state, latLng) {
      marker.state = state;
      if (state === 'countdown' && !marker.fireworkInterval) {triggerFirework(latLng); // Evento in countdown: avvia subito un firework e poi uno ogni 2,5 secondi
      marker.fireworkInterval = setInterval(() => triggerFirework(latLng), 2000); // Un fuoco ogni X secondi 1''=1000
    }
    if (state !== 'countdown' && marker.fireworkInterval) {clearInterval(marker.fireworkInterval); marker.fireworkInterval = null;}
      return;
    }

/* Gestione Overlay */
const overlay = document.getElementById('mapOverlay');
const toggle = document.getElementById('overlayToggle');
let timeout = 3 * 1000; // dopo 3 secondi minimizza l'Overlay 'minimizeOverlay()'

/* Minimizza l'overlay principale.
   Azioni: applica lo stato CSS minimizzato e mostra il pulsante di riapertura.
   Chiamata da: click esterno; timer iniziale. */  
function minimizeOverlay() {
  overlay.classList.add('minimized');
  toggle.style.display = 'flex';
}
      
/* Apre l'overlay principale.
   Azioni: rimuove lo stato minimizzato e nasconde il pulsante di riapertura.
   Chiamata da: click sul pulsante toggle. */
function openOverlay() {
  overlay.classList.remove('minimized');
  toggle.style.display = 'none';
}
// click fuori → chiude
document.addEventListener('click', (e) => {
  if (!overlay.contains(e.target) && !toggle.contains(e.target) && !overlay.classList.contains('minimized')) {minimizeOverlay();
  }
});
// evita chiusura cliccando dentro
overlay.addEventListener('click', (e) => {e.stopPropagation();
});
// click icona → riapre
toggle.addEventListener('click', openOverlay);
// Minimizza l'overlay dopo 3 secondi
setTimeout(() => { minimizeOverlay(); }, timeout);
/* Registra il Service Worker dell'app, se supportato dal browser. */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}
  
</script>
