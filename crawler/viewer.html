<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Aroundo Extractor Viewer</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#222
}

.top{
  background:#17202a;
  color:white;
  padding:20px
}

.top input{
  width:70%;
  padding:12px;
  border:0;
  border-radius:6px
}

.top button{
  padding:12px 18px;
  margin-left:8px;
  border:0;
  border-radius:6px;
  background:#2ecc71;
  color:white;
  font-weight:bold;
  cursor:pointer
}

.wrap{
  padding:20px;
  max-width:1400px;
  margin:auto
}

.structure{
  background:white;
  border-radius:10px;
  margin-bottom:20px;
  padding:10px;
  box-shadow:0 2px 8px #0001
}

.structure h2{
  margin-top:0
}

.badges{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center
}

.structure-item{
  width:100px;
  text-align:center
}

.badge{
  width:100px;
  height:34px;
  box-sizing:border-box;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:5px;
  color:white;
  font-size:13px;
  font-weight:bold
}

.yes{
  background:#27ae60
}

.no{
  background:#c0392b
}

.counts{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  margin-top:7px
}

.count{
  width:50%;
  font-size:14px;
  font-weight:bold;
  text-align:center
}

.count-complete{
  color:#27ae60
}

.count-incomplete{
  color:#e67e22
}

.section{
  background:white;
  border-radius:10px;
  margin-bottom:20px;
  padding:18px;
  box-shadow:0 2px 8px #0001
}

.section h2{
  margin-top:0
}

.events-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
  gap:18px;
  margin-top:15px
}

.event{
  background:#fff;
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 6px #0001
}

.event.complete{
  border-left:5px solid #27ae60
}

.event.incomplete{
  border-left:5px solid #e67e22
}

.event-image{
  width:100%;
  height:220px;
  background:#eef0f2;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden
}

.event-image img{
  width:100%;
  height:100%;
  object-fit:contain
}

.event-body{
  padding:16px
}

.event h3{
  margin:0 0 14px;
  font-size:20px
}

.event .field{
  margin:7px 0;
  line-height:1.45
}

.event .label{
  color:#444
}

.event-description{
  margin:12px 0;
  color:#555;
  line-height:1.5
}

.missing{
  margin-top:14px;
  padding:10px;
  background:#fff4e8;
  border-radius:6px;
  color:#b75d00;
  font-size:13px
}

.schema-button{
  margin-top:15px;
  padding:8px 12px;
  border:0;
  border-radius:6px;
  background:#34495e;
  color:white;
  cursor:pointer;
  font-size:13px;
  font-weight:bold
}

.schema-button:hover{
  background:#22313f
}

.schema-details{
  display:none;
  margin-top:14px;
  border-top:1px solid #ddd;
  padding-top:14px
}

.schema-details.open{
  display:block
}

.schema-field{
  padding:8px 0;
  border-bottom:1px solid #eee
}

.schema-field:last-child{
  border-bottom:0
}

.schema-name{
  font-weight:bold;
  color:#34495e;
  margin-bottom:4px
}

.schema-value{
  color:#333;
  white-space:pre-wrap;
  word-break:break-word
}

.schema-missing{
  color:#999;
  font-style:italic
}

.empty{
  padding:18px;
  background:#fafafa;
  border:1px dashed #bbb;
  border-radius:8px;
  color:#777
}
</style>
</head>

<body>

<div class="top">
  <input id="url" placeholder="https://www.esempio.it/">
  <button onclick="run()">ANALIZZA</button>
</div>

<div class="wrap" id="results"></div>

<script>
const endpoints = {
  3000: "https://super-system-pvvj4v777rw2rxwg-3000.app.github.dev",
  3002: "https://super-system-pvvj4v777rw2rxwg-3002.app.github.dev",
  3003: "https://super-system-pvvj4v777rw2rxwg-3003.app.github.dev"
};


/*
 * Il Viewer non decide come gli estrattori acquisiscono i dati.
 *
 * Ogni motore può avere una propria risposta tecnica.
 * Qui la risposta viene ricondotta al solo contratto comune:
 *
 *             Schema.org Event
 */


/* ---------------------------------------------------------
   Acquisizione
--------------------------------------------------------- */

async function call(port){

  const u = document.getElementById("url").value.trim();

  if(!u) return null;

  try{

    const r = await fetch(
      endpoints[port] + "/?url=" + encodeURIComponent(u)
    );

    return await r.json();

  }catch(e){

    return {
      error:e.message
    };
  }
}


/* ---------------------------------------------------------
   Conversione output motori -> Schema.org Event
--------------------------------------------------------- */

function extractEvents(data, port){

  if(!data || data.error){
    return [];
  }


  /*
   * SCHEMA / JSON-LD
   *
   * schema.js attualmente restituisce:
   *
   * data.normalizzazione.schema
   *
   * che può contenere array annidati.
   */

  if(port === 3000){

    const schema = data.normalizzazione &&
                   data.normalizzazione.schema;

    if(Array.isArray(schema)){

      const flat = schema.flat(Infinity);

      return flat.filter(item =>
        item &&
        typeof item === "object" &&
        item["@type"] === "Event"
      );
    }

    return [];
  }


  /*
   * STRUCTURED e HTML
   *
   * Il contratto attuale espone direttamente eventi[].
   *
   * In futuro potranno convergere direttamente
   * sullo stesso contratto Schema.org.
   */

  if(Array.isArray(data.eventi)){

    return data.eventi.filter(item =>
      item &&
      typeof item === "object"
    );
  }

  return [];
}


/* ---------------------------------------------------------
   Lettura campi Schema.org
--------------------------------------------------------- */

function value(v){

  if(v === null || v === undefined){
    return "";
  }

  if(typeof v === "string"){
    return v.trim();
  }

  if(typeof v === "object"){

    if(v.name){
      return value(v.name);
    }

    if(v["@value"]){
      return value(v["@value"]);
    }

    return JSON.stringify(v);
  }

  return String(v);
}


function eventTitle(e){

  return value(e.name) ||
         value(e.title);
}


function eventStart(e){

  return value(e.startDate);
}


function eventLocation(e){

  const l = e.location;

  if(!l){
    return "";
  }

  if(typeof l === "string"){
    return l;
  }

  const parts = [];

  if(l.name){
    parts.push(value(l.name));
  }

  const a = l.address;

  if(a){

    if(typeof a === "string"){
      parts.push(a);
    }else{

      [
        "streetAddress",
        "postalCode",
        "addressLocality",
        "addressRegion",
        "addressCountry"
      ].forEach(k => {

        if(a[k]){
          parts.push(value(a[k]));
        }

      });
    }
  }

  return parts.join(", ");
}


function eventOrganizer(e){

  return value(e.organizer);
}


/* ---------------------------------------------------------
   Validazione Viewer
--------------------------------------------------------- */

/*
 * Questi sono criteri del Viewer.
 *
 * Gli estrattori NON devono sapere cosa significa
 * "completo" o "incompleto".
 *
 * Se domani cambiamo i criteri, modifichiamo solo qui.
 */

const requiredFields = [
  "name",
  "startDate",
  "location",
];


function validateEvent(e){

  const missing = [];

  if(!eventTitle(e)){
    missing.push("titolo");
  }

  if(!eventStart(e)){
    missing.push("data/ora");
  }

  if(!eventLocation(e)){
    missing.push("luogo");
  }


  return {
    complete: missing.length === 0,
    missing
  };
}


/* ---------------------------------------------------------
   Deduplicazione
--------------------------------------------------------- */

function eventKey(e){

  return [
    eventTitle(e),
    eventStart(e),
    eventLocation(e)
  ].join("|").toLowerCase();
}


function uniqueEvents(events){

  const seen = new Set();
  const result = [];

  for(const e of events){

    const key = eventKey(e);

    if(seen.has(key)){
      continue;
    }

    seen.add(key);
    result.push(e);
  }

  return result;
}


/* ---------------------------------------------------------
   Visualizzazione valori Schema.org
--------------------------------------------------------- */

const schemaFields = [
  "@type",
  "name",
  "description",
  "image",
  "url",
  "startDate",
  "endDate",
  "eventStatus",
  "eventAttendanceMode",
  "location",
  "organizer",
  "performer",
  "offers",
  "audience",
  "inLanguage",
  "duration",
  "eventSchedule",
  "sameAs"
];


function formatSchemaValue(v){

  if(v === null || v === undefined || v === ""){
    return "";
  }

  if(typeof v === "object"){
    return JSON.stringify(v,null,2);
  }

  return String(v);
}


function schemaDetails(e, id){

  const fields = [...schemaFields];

  Object.keys(e).forEach(key => {

    if(!fields.includes(key)){
      fields.push(key);
    }

  });


  return `
    <div id="${id}" class="schema-details">

      ${fields.map(field => {

        const exists =
          e[field] !== undefined &&
          e[field] !== null &&
          e[field] !== "";

        return `
          <div class="schema-field">

            <div class="schema-name">
              ${escapeHtml(field)}
            </div>

            <div class="schema-value ${exists ? "" : "schema-missing"}">
              ${
                exists
                ? escapeHtml(formatSchemaValue(e[field]))
                : "non presente"
              }
            </div>

          </div>
        `;

      }).join("")}

    </div>
  `;
}


/* ---------------------------------------------------------
   Visualizzazione evento
--------------------------------------------------------- */

function showEvent(e, validation, index){

  const title = eventTitle(e);
  const start = eventStart(e);
  const end = value(e.endDate);
  const location = eventLocation(e);
  const organizer = eventOrganizer(e);
  const description = value(e.description);
  const image = value(e.image);

  const detailsId =
    "schema-details-" + index + "-" +
    Math.random().toString(36).slice(2,8);


  return `
    <article class="event ${validation.complete ? "complete" : "incomplete"}">

      ${
        image
        ? `
          <div class="event-image">
            <img
              src="${escapeHtml(image)}"
              alt=""
            >
          </div>
        `
        : ""
      }

      <div class="event-body">

        <h3>
          ${escapeHtml(title || "Evento senza titolo")}
        </h3>

        ${
          description
          ? `
            <div class="event-description">
              ${escapeHtml(description)}
            </div>
          `
          : ""
        }

        <div class="field">
          <span class="label">Inizio:</span>
          ${escapeHtml(start || "—")}
        </div>

        ${
          end
          ? `
            <div class="field">
              <span class="label">Fine:</span>
              ${escapeHtml(end)}
            </div>
          `
          : ""
        }

        <div class="field">
          <span class="label">Luogo:</span>
          ${escapeHtml(location || "—")}
        </div>

        ${
          organizer
          ? `
            <div class="field">
              <span class="label">Organizzatore:</span>
              ${escapeHtml(organizer)}
            </div>
          `
          : ""
        }

        ${
          !validation.complete
          ? `
            <div class="missing">
              Dati fondamentali mancanti:
              ${escapeHtml(validation.missing.join(", "))}
            </div>
          `
          : ""
        }

        <button
          class="schema-button"
          onclick="toggleSchema('${detailsId}', this)"
        >
          → Schema.org
        </button>

        ${schemaDetails(e,detailsId)}

      </div>

    </article>
  `;
}


/* ---------------------------------------------------------
   Visualizzazione sezione eventi
--------------------------------------------------------- */

function showEventsSection(title, events, incomplete){

  let html = `
    <div class="section">

      <h2>${title} ${events.length}</h2>

      <div class="events-grid">
  `;


  if(!events.length){

    html += `
      <div class="empty">
        Nessun elemento ${incomplete ? "incompleto" : "completo"}.
      </div>
    `;

  }else{

    events.forEach((item,index) => {

      html += showEvent(
        item.event,
        item.validation,
        title + "-" + index
      );

    });

  }


  html += `
      </div>

    </div>
  `;

  return html;
}


/* ---------------------------------------------------------
   Conteggi per struttura
--------------------------------------------------------- */

function engineCounts(events){

  let complete = 0;
  let incomplete = 0;

  events.forEach(e => {

    if(validateEvent(e).complete){
      complete++;
    }else{
      incomplete++;
    }

  });


  return {
    complete,
    incomplete
  };
}


/* ---------------------------------------------------------
   Strutture rilevate
--------------------------------------------------------- */

function structure(html, engineEvents){

  if(!html){
    return "";
  }

  const tests = [

    [
      "JSON-LD",
      /<script\b[^>]*type\s*=\s*["']application\/ld\+json["']/i
    ],

    [
      "Microdata",
      /\bitemscope\b|\bitemprop\s*=/i
    ],

    [
      "RDFa",
      /\btypeof\s*=|\bproperty\s*=/i
    ],

    [
      "OpenGraph",
      /<meta\b[^>]*(?:property\s*=\s*["']og:|name\s*=\s*["']og:)/i
    ],

    [
      "Twitter Card",
      /<meta\b[^>]*name\s*=\s*["']twitter:/i
    ],

    [
      "Meta",
      /<meta\b/i
    ],

    [
      "HTML",
      /<html\b/i
    ],

    [
      "Card",
      /\b(card|event|evento|eventi|appuntamenti|programma)\b/i
    ],

    [
      "Link",
      /<a\b[^>]*href\s*=/i
    ],

    [
      "Immagini",
      /<img\b/i
    ]

  ];


  const schemaEvents =
    engineEvents[3000] || [];

  const structuredEvents =
    engineEvents[3002] || [];

  const htmlEvents =
    engineEvents[3003] || [];


  const schemaCounts =
    engineCounts(schemaEvents);

  const structuredCounts =
    engineCounts(structuredEvents);

  const htmlCounts =
    engineCounts(htmlEvents);


  function structureItem(name, detected, counts){

    return `
      <div class="structure-item">

        <span class="badge ${detected ? "yes" : "no"}">
          ${name}
        </span>

        <div class="counts">

          <span class="count count-complete">
            ${counts.complete}
          </span>

          <span class="count count-incomplete">
            ${counts.incomplete}
          </span>

        </div>

      </div>
    `;
  }


  const detection = {};

  tests.forEach(test => {

    detection[test[0]] = test[1].test(html);

  });


  return `
    <div class="structure">

      <h2>Strutture</h2>

      <div class="badges">

        ${structureItem(
          "JSON-LD",
          detection["JSON-LD"],
          schemaCounts
        )}

        ${structureItem(
          "Microdata",
          detection["Microdata"],
          structuredCounts
        )}

        ${structureItem(
          "RDFa",
          detection["RDFa"],
          structuredCounts
        )}

        ${structureItem(
          "OpenGraph",
          detection["OpenGraph"],
          {complete:0,incomplete:0}
        )}

        ${structureItem(
          "Twitter Card",
          detection["Twitter Card"],
          {complete:0,incomplete:0}
        )}

        ${structureItem(
          "Meta",
          detection["Meta"],
          {complete:0,incomplete:0}
        )}

        ${structureItem(
          "HTML",
          detection["HTML"],
          htmlCounts
        )}

        ${structureItem(
          "Card",
          detection["Card"],
          htmlCounts
        )}

        ${structureItem(
          "Link",
          detection["Link"],
          {complete:0,incomplete:0}
        )}

        ${structureItem(
          "Immagini",
          detection["Immagini"],
          {complete:0,incomplete:0}
        )}

      </div>

    </div>
  `;
}


/* ---------------------------------------------------------
   Escape HTML
--------------------------------------------------------- */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ---------------------------------------------------------
   Apertura dettaglio Schema.org
--------------------------------------------------------- */

function toggleSchema(id,button){

  const element =
    document.getElementById(id);

  if(!element){
    return;
  }

  const open =
    element.classList.toggle("open");

  button.textContent =
    open
    ? "← Chiudi Schema.org"
    : "→ Schema.org";
}


/* ---------------------------------------------------------
   Avvio analisi
--------------------------------------------------------- */

async function run(){

  const r = document.getElementById("results");

  r.innerHTML = "<p>Analisi in corso...</p>";


  const [schemaData, structuredData, htmlData] =
    await Promise.all([

      call(3000),
      call(3002),
      call(3003)

    ]);


  /*
   * La struttura della pagina viene analizzata
   * sul contenuto HTML acquisito.
   */

  const sourceHtml =
    (htmlData && htmlData.content) ||
    (schemaData && schemaData.content) ||
    (structuredData && structuredData.content) ||
    "";


  const schemaEvents =
    uniqueEvents(
      extractEvents(schemaData,3000)
    );


  const structuredEvents =
    uniqueEvents(
      extractEvents(structuredData,3002)
    );


  const htmlEvents =
    uniqueEvents(
      extractEvents(htmlData,3003)
    );


  const engineEvents = {

    3000: schemaEvents,
    3002: structuredEvents,
    3003: htmlEvents

  };


  const allEvents = uniqueEvents([
    ...schemaEvents,
    ...structuredEvents,
    ...htmlEvents
  ]);


  const completeEvents = [];
  const incompleteEvents = [];


  for(const e of allEvents){

    const validation =
      validateEvent(e);

    if(validation.complete){

      completeEvents.push({
        event:e,
        validation
      });

    }else{

      incompleteEvents.push({
        event:e,
        validation
      });

    }

  }


  r.innerHTML =
      structure(
        sourceHtml,
        engineEvents
      )

    + showEventsSection(
        "Completi",
        completeEvents,
        false
      )

    + showEventsSection(
        "Incompleti",
        incompleteEvents,
        true
      );
}
</script>

</body>
</html>
