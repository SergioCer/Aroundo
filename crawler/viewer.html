<body>
<div class="top">

</div>
  <div class="section">
<div class="event-controls">
  <button id="analyzeBtn" class="schema-button">ESTRAI</button>

  <label for="sortBy">Ordina per:</label>
  <select id="sortBy">
    <option value="id">ID</option>

    <option value="place">Luogo</option>
  </select>

</div>

<div id="reconciliation"></div>    
<div class="wrap">
    <div id="results">
      <div class="empty">
        Caricamento degli eventi da Supabase...
      </div>
    </div>
  </div>
</div>

<script type="module">
import { supabase } from "../supabase.js";
import { runAnalysis } from "./html.js";

/* UTILITÀ */
function escapeHtml(value){
  if(value === null || value === undefined){
    return "";
  }
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function value(v) {
  if (v === null || v === undefined) return "";
  if (Array.isArray(v)) {return v.map(value).filter(Boolean).join(", ");}
  if (typeof v === "object") {
    if (v.name) return value(v.name);
    if (v["@value"] !== undefined) return value(v["@value"]);
    const address = v.address;
    if (address) {const parts = [
        v.name,
        typeof address === "string" ? address : address.streetAddress,
        typeof address === "object" ? address.addressLocality : null,
        typeof address === "object" ? address.addressRegion : null
      ].map(value).filter(Boolean);
      if (parts.length) return [...new Set(parts)].join(", ");
    }
    return JSON.stringify(v);
  }
  return String(v).trim();
}

function formatDate(value){
  if(!value){return {date:"", time:""};}
  try{
    const date = new Date(value);
    if(Number.isNaN(date.getTime())){return {date:value, time:""};}
    const datePart = date.toLocaleDateString("it-IT", {day:"2-digit", month:"2-digit", year:"numeric"});
    const hasTime = /T\d{2}:\d{2}/.test(value);
    const timePart = hasTime ? date.toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"}) : "";
    return {date:datePart, time:timePart};
  }catch(e){return {date:value, time:""};}
}

function eventLocation(event) {const location = event.location;
  if (!location) return "";
  if (typeof location === "string") return location;
  if (typeof location !== "object") return "";
  const parts = [];
  if (location.name) {parts.push(value(location.name));}
  const address = location.address;
  if (typeof address === "string") {parts.push(address);
  } else if (address && typeof address === "object") {
    [
      address.streetAddress,
      address.addressLocality,
      address.addressRegion,
      address.postalCode
    ].forEach(part => {
      const text = value(part);
      if (text && !parts.includes(text)) parts.push(text);});
  }
  return [...new Set(parts)].join(", ");
}

/* CAMPI ORDINABILI di SCHEMA.ORG */
const schemaFields = [
  "name",
  "description",
  "startDate",
  "endDate",
  "duration",
  "doorTime",
  "location",
  "offers",
  "isAccessibleForFree",
  "organizer",
  "creator",
  "performer",
  "actor",
  "composer",
  /* CLASSIFICAZIONE */
  "strength",       // Forza della classificazione
  "category",
  "categorySlug",   // Slug categoria valorizzato
  "macroCount",     // conteggio macroCategorie
  "macroMatches",   // corrispondenze macroCategorie
  "subCount",       // conteggio subCategorie
  "subMatches",     // corrispondenze subCategorie
  /* ANALISI DELL'ESTRAZIONE */
  "fundamentals",   // Campi Fondamentali
  "reinforcements", // Campi Rafforzativi
  "signals",        // Segnali intercettati
  /* RIFERIMENTI INTERNI */
  "id_site_page",   // riferimento pagina sorgente
  "id_comune",      // ID del comune
  "classification", // Attributo: Evento / Incompleto / json
  /* ALTRE PROPRIETÀ SCHEMA.ORG */
  "subEvent",
  "superEvent",
  "eventAttendanceMode",
  "eventStatus",
  "eventSchedule",
  "previousStartDate",
  "audience",
  "inLanguage",
  "image",
  "url",
  "sameAs"
];

function formatSchemaValue(value){
  if(value === null || value === undefined || value === ""
  ){return "";}
  if(typeof value === "object"){return JSON.stringify(value, null, 2);}
  return String(value);
}
  
function displaySchemaValue(v){
  if(v === null || v === undefined){return "";}
  if(Array.isArray(v)){return v
    .map(item => displaySchemaValue(item))
    .filter(Boolean)
    .join(", ");
  }
  if(typeof v === "object"){
    if(v.description){return displaySchemaValue(v.description);}
    if(v.name){return displaySchemaValue(v.name);}
    if(v["@value"]){return displaySchemaValue(v["@value"]);}
    if(v.price !== undefined){const currency = v.priceCurrency ? ` ${v.priceCurrency}`: ""; return `${v.price}${currency}`;}
    return JSON.stringify(v);}
  return String(v);
}

function schemaDetails(event, id, reconciliationRole = null, rowId = null) {
  const fields = [...schemaFields];
  Object.keys(event).forEach(key => {if (!fields.includes(key)) fields.push(key);});
  const isReconciliationCard =
    reconciliationRole === "parent" ||
    reconciliationRole === "child";
  return `<div id="${id}" class="schema-details ${isReconciliationCard ? "open" : ""}">
    ${fields.map(field => {
      const v = event[field];
      const exists = v !== undefined && v !== null && v !== "";
      if (!exists) return "";
      const selection = reconciliationSelections.get(field);
      const isSelected = !!selection && (reconciliationRole === "parent" || (reconciliationRole === "child" && selection.childId === String(rowId)));
      const isChildField = reconciliationRole === "child" &&  exists && !nonReconciledFields.has(field);
      const unavailable = isChildField && !!selection &&  selection.childId !== String(rowId);
      const classes = ["schema-field", isChildField ? "reconciliation-field-selectable" : "", isSelected ? "reconciliation-field-selected" : "",
        unavailable ? "reconciliation-field-unavailable" : ""].filter(Boolean).join(" ");
      const dataAttributes = isChildField ? `data-reconciliation-field="${escapeHtml(field)}" data-child-id="${escapeHtml(rowId)}"
        title="${unavailable  ? "Deseleziona prima la fonte attuale di questo campo" : "Clicca per selezionare o deselezionare questo valore"}"`: "";
      return `<div class="${classes}" ${dataAttributes}><div class="schema-name">${escapeHtml(field)}</div>
        <div class="schema-value ${exists ? "" : "schema-missing"}">${exists ? escapeHtml(formatSchemaValue(v)) : "null"}</div></div>`;}).join("")}</div>`;
}

/* SCHEDA EVENTO */
function eventCard(row, index, reconciliationRole = null){
  const event = reconciliationRole === "parent" ? getReconciledSchema(row) : (row.se_schema || {});
  const title = value(event.name) || value(event.title) || "Evento senza titolo";
  const description = value(event.description);
  const startDate = value(event.startDate);
  const endDate = value(event.endDate);
  const location = eventLocation(event);
  const comune = value(event.location && typeof event.location === "object" ? event.location.address?.addressLocality: "");
  const organizer = value(event.organizer);
  const offers = displaySchemaValue(event.offers);
  const performer = displaySchemaValue(event.performer);
  const category = displaySchemaValue(event.category);
  const creator = displaySchemaValue(event.creator);
  const image = value(event.image);
  const sourceUrl = row.site_pages && row.site_pages.sp_url ? row.site_pages.sp_url : value(event.url);
  const schemaId = `schema-${row.id_site_event || index}`;
  return `<article class="event">
      ${image ? `<div class="event-image"><img src="${escapeHtml(image)}" alt="${escapeHtml(title)}" loading="lazy"></div>`: ""}
        <div class="event-body"><h3>${escapeHtml(title)}<span class="record-id">#${escapeHtml(row.id_site_event)}</span></h3>
      ${startDate ? `<div class="field"><span class="label">Data:</span> ${escapeHtml(formatDate(startDate).date)}${formatDate(startDate).time ? ` <span class="label">
        Ora:</span> ${escapeHtml(formatDate(startDate).time)}`: ""}</div>`: ""}
      ${endDate ? `<div class="field"><span class="label">Fine:</span> ${escapeHtml(formatDate(endDate).date)}${formatDate(endDate).time ? ` <span class="label">
      Ora:</span> ${escapeHtml(formatDate(endDate).time)}` : ""}</div>` : ""}
      ${comune ? `<div class="field"><span class="label">Comune: </span>${escapeHtml(comune)}</div>`: ""}
      ${location ? `<div class="field"><span class="label">Luogo: </span>${escapeHtml(location)}</div>`: ""}
      ${offers ? `<div class="field"> <span class="label">Prezzo:</span> ${escapeHtml(offers)}</div>`: ""}
      ${organizer ? `<div class="field"><span class="label">Organizzatore: </span>${escapeHtml(organizer)}</div>`: ""}
      ${performer ? `<div class="field"><span class="label">Performer: </span>${escapeHtml(performer)}</div>`: ""}   
      ${creator ? `<div class="field"><span class="label">Creator: </span>${escapeHtml(creator)}</div>`: ""}
      ${category ? `<div class="field"><span class="label">Categoria: </span>${escapeHtml(category)}</div>`: ""}
      ${description ? `<div class="event-description">${escapeHtml(description)}</div>`: ""}
      ${sourceUrl ? `<div class="source"><span class="label">Fonte:</span><a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noopener noreferrer">
      ${escapeHtml(sourceUrl)}</a></div>`: ""}
      <div class="timestamp">Acquisito: ${escapeHtml(formatDate(row.se_extracted).date)} - 
      <span class="classification-${escapeHtml(value(event.classification))}">${escapeHtml(value(event.classification))}</span>
      ${reconciliationButton(row, reconciliationRole)}
      <button class="schema-button" onclick="toggleSchema('${schemaId}')">Schema</button>
      <button class="delete-button" onclick="deleteEvent('${row.id_site_event}')">Delete</button>
      ${schemaDetails(event, schemaId, reconciliationRole, row.id_site_event)}</div></article>`;
}

window.deleteEvent=deleteEvent;
window.selectParent = selectParent;
window.addReconciliationChild = addReconciliationChild;
window.removeFromReconciliation = removeFromReconciliation;
window.confirmReconciliation = confirmReconciliation;  
  
/* APERTURA / CHIUSURA SCHEMA */
window.toggleSchema = function(id){
  const element = document.getElementById(id);
  if(!element){return;}
  element.classList.toggle("open");
};

document.getElementById("reconciliation").addEventListener("click",
  event => {const fieldElement = event.target.closest(".schema-field[data-reconciliation-field]");
    if (!fieldElement) return;
    toggleReconciliationField(fieldElement.dataset.reconciliationField, fieldElement.dataset.childId);
  }
);
  
let loadedEvents = [];
let sortBy = "id";
let sortAscending = true;
let reconciliationParentId = null;
let reconciliationSaving = false;  
const reconciliationChildIds = new Set();

/* field -> {
 *   childId: ID del figlio fonte,
 *   value: valore selezionato,
 *   mode: "auto" oppure "manual"
 * } */
const reconciliationSelections = new Map();
/* Campi per i quali non devono partire nuove proposte automatiche. La scelta manuale rimane comunque possibile. */
const reconciliationLockedFields = new Set();
/* Metadati che non devono essere ereditati automaticamente dai figli. */
const nonReconciledFields = new Set(["classification", "id_site_page"]);

function cloneJson(value) {
  if (value === undefined) return undefined;
  return JSON.parse(JSON.stringify(value));
}

function hasSchemaValue(value) {
  return value !== undefined && value !== null && value !== "";
}

function sameSchemaValue(a, b) {
  if (a === b) return true;
  if (a === null || b === null || a === undefined || b === undefined) {return false;}
  if (typeof a !== "object" || typeof b !== "object") {return false;}
  if (Array.isArray(a) !== Array.isArray(b)) {return false;}
  if (Array.isArray(a)) {
    return a.length === b.length && a.every((item, index) => sameSchemaValue(item, b[index]));}
  const keysA = Object.keys(a).sort();
  const keysB = Object.keys(b).sort();
  return keysA.length === keysB.length &&
    keysA.every((key, index) => key === keysB[index] && sameSchemaValue(a[key], b[key]));
}

/* Crea il JSON temporaneo da mostrare nel padre. */
function getReconciledSchema(parentRow) {
  const result = cloneJson(parentRow.se_schema || {});
  reconciliationSelections.forEach((selection, field) => {result[field] = cloneJson(selection.value);});
  return result;
}

function selectParent(id) {
  if (reconciliationParentId !== null) return;
  reconciliationParentId = String(id);
  reconciliationChildIds.clear();
  reconciliationSelections.clear();
  reconciliationLockedFields.clear();
  sortEvents();
}

/* L'automatismo viene eseguito soltanto all'ingresso effettivo del figlio nell'area di riconciliazione. */
function proposeFieldsFromChild(childRow) {
  const parentRow = loadedEvents.find(
    row => String(row.id_site_event) === reconciliationParentId
  );
  if (!parentRow) return;
  const parentSchema = parentRow.se_schema || {};
  const childSchema = childRow.se_schema || {};
  const childId = String(childRow.id_site_event);
  Object.entries(childSchema).forEach(([field, childValue]) => {
    if (nonReconciledFields.has(field)) return;
    if (!hasSchemaValue(childValue)) return;
    const currentSelection = reconciliationSelections.get(field);
    /* Una selezione manuale è definitiva finché l'utente non la modifica o la deseleziona. */
    if (currentSelection?.mode === "manual") return;
    /* Se il padre ha già un valore originale, niente sovrascrittura automatica. */
    if (hasSchemaValue(parentSchema[field]) && !currentSelection) {return;}
    /* Un campo già chiuso all'automatismo non viene riproposto quando entrano altri figli. */
    if (reconciliationLockedFields.has(field) && !currentSelection) {return;}
    if (!currentSelection) {reconciliationSelections.set(field, {childId, value: cloneJson(childValue), mode: "auto"}); return;}
    /* Un secondo figlio concorde non cambia la fonte. Un valore discordante ritira la proposta automatica e lascia il campo alla scelta manuale. */
    if (!sameSchemaValue(currentSelection.value, childValue)) {reconciliationSelections.delete(field); reconciliationLockedFields.add(field);}
  });
}

function addReconciliationChild(id) {
  const childId = String(id);
  if (reconciliationParentId === null) return;
  if (childId === reconciliationParentId) return;
  if (reconciliationChildIds.has(childId)) return;
  const childRow = loadedEvents.find(row => String(row.id_site_event) === childId);
  if (!childRow) return;
  reconciliationChildIds.add(childId);
  // L'unico punto in cui parte la proposta automatica.
  proposeFieldsFromChild(childRow);
  sortEvents();
}

function removeFromReconciliation(id, role) {
  const eventId = String(id);
  if (role === "parent") {
    // Il padre si può rimuovere solo senza figli.
    if (reconciliationChildIds.size > 0) return;
    reconciliationParentId = null;
    reconciliationChildIds.clear();
    reconciliationSelections.clear();
    reconciliationLockedFields.clear();
  } else if (role === "child") {
    if (!reconciliationChildIds.has(eventId)) return;
    reconciliationChildIds.delete(eventId);
    /* Se il figlio era fonte di campi, rimuove le sue selezioni e impedisce nuove proposte automatiche per quei campi durante questa riconciliazione. */
    reconciliationSelections.forEach((selection, field) => {
      if (selection.childId === eventId) {reconciliationSelections.delete(field); reconciliationLockedFields.add(field);}
    });
  }
  sortEvents();
}

function toggleReconciliationField(field, childId) {
  childId = String(childId);
  if (!reconciliationChildIds.has(childId)) return;
  const childRow = loadedEvents.find(row => String(row.id_site_event) === childId);
  if (!childRow) return;
  const childSchema = childRow.se_schema || {};
  const childValue = childSchema[field];
  if (nonReconciledFields.has(field)) return;
  if (!hasSchemaValue(childValue)) return;
  const currentSelection = reconciliationSelections.get(field);
  /* Clic sul valore già selezionato: deseleziona. */
  if (currentSelection?.childId === childId) {reconciliationSelections.delete(field); reconciliationLockedFields.add(field); sortEvents(); return;}
  /* Un altro figlio è già fonte di questo campo: occorre prima deselezionarlo. */
  if (currentSelection) {alert("Questo campo è già assegnato a un altro figlio. " + "Deseleziona prima il valore attuale."); return;}
  /* Se non esiste una selezione attiva, il clic crea una selezione manuale. */
  reconciliationSelections.set(field, {childId, value: cloneJson(childValue), mode: "manual"});
  reconciliationLockedFields.add(field);
  sortEvents();
}
  

function reconciliationButton(row, role = null) {
  const id = String(row.id_site_event);
  if (role === "parent") {
    if (reconciliationChildIds.size > 0) {      
      return `<button class="schema-button" type="button" onclick="confirmReconciliation()">RICONCILIA</button>`;}
      return `<button class="reconciliation-remove-button" type="button" onclick="removeFromReconciliation('${id}', 'parent')">Deseleziona</button>`;}
  if (role === "child") {
    return `<button class="reconciliation-remove-button" type="button" onclick="removeFromReconciliation('${id}', 'child')">Deseleziona</button>`;}
  if (reconciliationParentId === null) {
    return `<button class="reconciliation-select-button" type="button" onclick="selectParent('${id}')">PADRE</button>`;}
    return `<button class="reconciliation-select-button" type="button" onclick="addReconciliationChild('${id}')">FIGLIO</button>`;}

async function confirmReconciliation() {
  if (reconciliationSaving) return;
  if (reconciliationParentId === null ||
      reconciliationChildIds.size === 0) {
    alert("Seleziona un padre e almeno un figlio.");
    return;
  }
  const parentId = reconciliationParentId;
  const childIds = [...reconciliationChildIds];
  const parentRow = loadedEvents.find(
    row => String(row.id_site_event) === parentId
  );
  if (!parentRow) {alert("Il padre selezionato non è più disponibile."); return;}
  if (!confirm(
    `Confermi la riconciliazione?\n\n` +
    `Il padre #${parentId} verrà aggiornato e ` +
    `${childIds.length} figli verranno cancellati ` +
    `solo dopo il salvataggio riuscito.`
  )) {
    return;
  }
  reconciliationSaving = true;
  try {
    /* Prepara il JSON definitivo senza modificare preventivamente il record originale in memoria. */
    const finalSchema = getReconciledSchema(parentRow);
    finalSchema.classification = "Riconciliato";
    /* 1. Salva il padre. */
    const { error: updateError } = await supabase
      .from("site_events")
      .update({ se_schema: finalSchema })
      .eq("id_site_event", parentId);
    if (updateError) {
      throw new Error(`Salvataggio del padre non riuscito: ${updateError.message}`);
    }
    /* Aggiorna subito il padre locale: anche se la cancellazione fallisse, il padre risulterà completo. */
    parentRow.se_schema = finalSchema;
    /* 2. Solo dopo il salvataggio riuscito, elimina i figli. */
    const { error: deleteError } = await supabase
      .from("site_events")
      .delete()
      .in("id_site_event", childIds);
    if (deleteError) {
      document.getElementById("status").textContent =
        String(loadedEvents.length);
      sortEvents();
      alert("Il padre è stato salvato come Riconciliato, " +
        "ma la cancellazione dei figli non è riuscita.\n\n" +
        "I figli sono rimasti disponibili.\n" +
        deleteError.message
      );
      return;
    }
    /* 3. Cancellazione riuscita: aggiorna lo stato locale. */
    const deletedIds = new Set(childIds);
    loadedEvents = loadedEvents.filter(
      row => !deletedIds.has(String(row.id_site_event))
    );
    reconciliationParentId = null;
    reconciliationChildIds.clear();
    reconciliationSelections.clear();
    reconciliationLockedFields.clear();
    document.getElementById("status").textContent =
      String(loadedEvents.length);
    sortEvents();
    alert("Riconciliazione completata con successo.");
  } catch (error) {console.error("Errore durante la riconciliazione:", error);
    alert("Errore durante la riconciliazione.\n\n" +
      error.message
    );
  } finally {
    reconciliationSaving = false;
  }
}
  
/* ORDINAMENTO EVENTI */
function sortEvents() {
  const getDate = (row) => {
    const schema = row.se_schema || {};
    return schema.startDate || schema.data?.date || "";
  };
const getPlace = (row) => {const location = row.se_schema?.location;
  if (!location || typeof location !== "object") return "";
  return location.address?.addressLocality
    || location.name
    || "";
};
  loadedEvents.sort((a, b) => {
    const dateA = getDate(a);
    const dateB = getDate(b);
    const placeA = getPlace(a);
    const placeB = getPlace(b);
    let result = 0;
    const compareDate = () => {
      if (!dateA && !dateB) return 0;
      if (!dateA) return 1;
      if (!dateB) return -1;
      return String(dateA).localeCompare(String(dateB));
    };
    const comparePlace = () => {
      if (!placeA && !placeB) return 0;
      if (!placeA) return 1;
      if (!placeB) return -1;
      return String(placeA).localeCompare(
        String(placeB), "it",
        { numeric: true, sensitivity: "base" }
      );
    };
    if (sortBy === "date") {
      result = compareDate();
    } else if (sortBy === "place") {
      result = comparePlace();
    } else if (sortBy === "date-place") {
      result = compareDate();
      if (result === 0) result = comparePlace();
    } else if (sortBy === "place-date") {
      result = comparePlace();
      if (result === 0) result = compareDate();
    } else {
      result = Number(a.id_site_event) - Number(b.id_site_event);
    }
    return sortAscending ? result : -result;
  });
  const parentRow = loadedEvents.find(row => String(row.id_site_event) === reconciliationParentId);
  const childRows = loadedEvents.filter(row => reconciliationChildIds.has(String(row.id_site_event)));
  const selectedIds = new Set([ ...(reconciliationParentId !== null ? [reconciliationParentId] : []), ...reconciliationChildIds]);
  const normalRows = loadedEvents.filter(row => !selectedIds.has(String(row.id_site_event)));
// Riconciliazione: fuori dall'area che scorre
document.getElementById("reconciliation").innerHTML = parentRow
    ? `<section class="reconciliation-section"><h2>Riconciliazione</h2><div class="events-grid reconciliation-grid"><div class="reconciliation-card"><h3>PADRE</h3>
    ${eventCard(parentRow, 0, "parent")}</div>
    ${childRows.map((row, index) => `<div class="reconciliation-card"><h3>FIGLIO</h3> ${eventCard(row, index, "child")}</div>`).join("")}</div></section>`: "";
// Eventi non selezionati: unica area scorrevole
document.getElementById("results").innerHTML = `<div class="events-grid"> ${normalRows.map((row, index) => eventCard(row, index)).join("")}</div>`;
}

/* Cancella l'evento selezionato */ 
async function deleteEvent(id) {
  const { error } = await supabase
    .from("site_events")
    .delete()
    .eq("id_site_event", id);
  if (error) {console.error(error); alert("Errore durante l'eliminazione"); return;}
  // Rimuove il record anche dall'array usato per l'ordinamento.
  loadedEvents = loadedEvents.filter(row => String(row.id_site_event) !== String(id));
  // Aggiorna le schede, il conteggio e l'ordinamento.
  document.getElementById("status").textContent = String(loadedEvents.length);
  sortEvents();
}
  
document.getElementById("sortBy").addEventListener("change", (event) => {
  sortBy = event.target.value;
  sortEvents();
});
  
document.getElementById("sortDirection").addEventListener("click", () => {
  sortAscending = !sortAscending;
  document.getElementById("sortDirection").textContent =
    sortAscending ? "↑ Crescente" : "↓ Decrescente";
  sortEvents();
});
  
/* LETTURA SUPABASE */
async function loadEvents(){
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  try{
    /* site_events site_pages viene utilizzata solamente per recuperare l'URL della pagina origine. */
    const { data, error } =
      await supabase
        .from("site_events")
        .select(`id_site_event, id_site_page, id_evento, se_schema, se_extracted, site_pages (sp_url)`)
        .order("id_site_event",{ascending:false});
    if(error){throw error;}
    if(!data || data.length === 0){
      status.textContent = "Nessun evento presente!";
      results.innerHTML = `<div class="empty">La tabella site_events non contiene eventi. Eseguire ESTRAI</div>`;
      return;}
    loadedEvents = data;
    status.textContent = `${data.length}`;
    sortEvents();
  }catch(error){
    console.error("Errore lettura site_events:", error);
    status.textContent = "Errore durante il caricamento.";
    results.innerHTML = `<div class="error"><strong>Errore lettura Supabase</strong><br><br>${escapeHtml(error.message)}</div>`;}
}

/* AVVIO */
document.getElementById("analyzeBtn").addEventListener("click", async () => {
  const button = document.getElementById("analyzeBtn");
  const status = document.getElementById("analysisStatus");
  button.disabled = true;
  status.textContent = "Analisi in corso...";
  try {
    await runAnalysis(supabase);
    status.textContent = "Analisi completata!";
    await loadEvents();
  } catch (error) {
    console.error("[HTML] Errore analisi:", error);
    status.textContent = `Errore: ${error.message}`;
  } finally {
    button.disabled = false;
  }
});

loadEvents();
