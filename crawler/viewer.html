<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Aroundo Extractor Viewer</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}.top{background:#17202a;color:white;padding:20px}.top input{width:70%;padding:12px;border:0;border-radius:6px}.top button{padding:12px 18px;margin-left:8px;border:0;border-radius:6px;background:#2ecc71;color:white;font-weight:bold}.wrap{padding:20px;max-width:1400px;margin:auto}.engine{background:white;border-radius:10px;margin-bottom:20px;padding:18px;box-shadow:0 2px 8px #0001}.engine h2{margin-top:0}.event{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0;background:#fafafa}.event img{max-width:180px;max-height:110px;object-fit:cover;float:right}.count{font-weight:bold;color:#167c4a}</style></head><body><div class="top"><input id="url" placeholder="https://www.esempio.it/"><button onclick="run()">ANALIZZA</button></div><div class="wrap" id="results"></div><script>
async function call(port){
const u=document.getElementById("url").value.trim();
if(!u)return null;
try{
const base={
3000:"https://solid-palm-tree-pvvj4v7jv4ph67g9-3000.app.github.dev",
3002:"https://solid-palm-tree-pvvj4v7jv4ph67g9-3002.app.github.dev",
3003:"https://solid-palm-tree-pvvj4v7jv4ph67g9-3003.app.github.dev"
}[port];
const r=await fetch(base+"/?url="+encodeURIComponent(u));
return await r.json()
}catch(e){return{error:e.message}}
}
function show(name,data){let h="<div class='engine'><h2>"+name+"</h2>";if(!data){h+="<p>Nessun risultato</p></div>";return h}if(data.error){h+="<p>Errore: "+data.error+"</p></div>";return h}const ev=data.eventi||[];h+="<p class='count'>Eventi trovati: "+ev.length+"</p>";for(const e of ev){const d=e.data||{};h+="<div class='event'>"+(d.image?"<img src='"+d.image+"'>":"")+"<strong>"+(d.name||d.title||"Evento senza titolo")+"</strong><br><small>"+(d.startDate||d.date||"")+"</small><p>"+(d.description||d.text||"")+"</p></div>"}return h+"</div>"}async function run(){const r=document.getElementById("results");r.innerHTML="<p>Analisi in corso...</p>";const[s,m,h]=await Promise.all([call(3000),call(3002),call(3003)]);r.innerHTML=show("SCHEMA / JSON-LD",s)+show("MICRODATA / RDFa",m)+show("HTML / CARD",h)}</script></body></html>
