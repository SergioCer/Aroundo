<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Aroundo Event Viewer</title>
<style>body{font-family:Arial,sans-serif;background:#f4f5f7;margin:0;padding:24px;color:#222}input,button{padding:10px;border:1px solid #ccc;border-radius:8px}input{width:70%}button{cursor:pointer;background:#111;color:#fff}.motori{display:flex;gap:10px;margin:18px 0}.box{background:#fff;border-radius:12px;padding:16px;margin:18px 0}.eventi{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.evento{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001}.evento img{width:100%;height:180px;object-fit:cover}.evento div{padding:14px}.evento h3{margin:0 0 8px}.badge{display:inline-block;background:#eee;border-radius:20px;padding:4px 8px;font-size:12px}</style></head><body><h1>Aroundo — Event Viewer</h1><input id="url" placeholder="https://esempio.it"><button onclick="run()">Analizza</button><div class="motori"><div class="box">Schema: <b id="schemaCount">0</b></div><div class="box">Structured: <b id="structuredCount">0</b></div><div class="box">HTML: <b id="htmlCount">0</b></div></div><div id="risultati"></div><script>async function motore(porta,url){try{const r=await fetch("https://"+location.hostname.replace(/-3000\./,"-"+porta+".")+":"+porta+"/?url="+encodeURIComponent(url));return await r.json();}catch(e){return{error:e.message,eventi:[]};}}async function run(){const url=document.getElementById("url").value.trim();if(!url)return;document.getElementById("risultati").innerHTML="<p>Analisi in corso...</p>";const [schema,structured,html]=await Promise.all([motore(3001,url),motore(3002,url),motore(3003,url)]);document.getElementById("schemaCount").textContent=(schema.eventi||[]).length;document.getElementById("structuredCount").textContent=(structured.eventi||[]).length;document.getElementById("htmlCount").textContent=(html.eventi||[]).length;const gruppi=[["SCHEMA.ORG",schema.eventi||[]],["MICRODATA / RDFA",structured.eventi||[]],["HTML / CARD",html.eventi||[]]];let out="";for(const [nome,eventi] of gruppi){if(!eventi.length)continue;out+="<h2>"+nome+" — "+eventi.length+" eventi</h2><div class='eventi'>";for(const e of eventi){const img=e.image||e.image_url||null;const titolo=e.name||e.title||"Evento senza titolo";const testo=e.description||e.text||"";out+="<article class='evento'>"+(img?"<img src='"+img+"'>":"")+"<div><span class='badge'>"+nome+"</span><h3>"+titolo+"</h3><p>"+testo.slice(0,500)+"</p>"+(e.startDate?"<p>📅 "+e.startDate+"</p>":"")+"</div></article>"}out+="</div>"}if(!out)out="<div class='box'>Nessun evento trovato dai tre motori.</div>";document.getElementById("risultati").innerHTML=out}</script></body>
</html>
