<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Aroundo Extractor Viewer</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#222
}

.top{
  background:#17202a;
  color:white;
  padding:20px
}

.top input{
  width:70%;

  border:0;

}

.top button{
  padding:12px 18px;
  margin-left:8px;
  border:0;
  border-radius:6px;
  background:#2ecc71;

  font-weight:bold;
  cursor:pointer
}

.wrap{
  padding:20px;
  max-width:1400px;
  margin:auto
}

.structure{
  background:white;
  border-radius:10px;
  margin-bottom:20px;
  padding:18px;
  box-shadow:0 2px 8px #0001
}

.structure h2{
  margin-top:0
}

.badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap
}

.badge{
  padding:7px 10px;
  border-radius:5px;
  color:white;
  font-size:13px;
  font-weight:bold
}

.yes{
  background:#27ae60
}

.no{
  background:#c0392b
}

.engine{
  background:white;
  border-radius:10px;
  margin-bottom:20px;
  padding:18px;
  box-shadow:0 2px 8px #0001
}

.engine h2{
  margin-top:0
}

.summary{
  display:flex;
  gap:10px;
  margin:10px 0 18px
}

.marker{
  color:white;
  border-radius:5px;
  padding:7px 12px;
  font-weight:bold;
  font-size:13px
}

.complete-marker{
  background:#27ae60
}

.incomplete-marker{
  background:#c0392b
}

.event{
  border:1px solid #ddd;
  border-radius:8px;
  padding:14px;
  margin:10px 0;
  background:#fafafa;
  overflow:auto
}

.event img{
  max-width:180px;
  max-height:110px;
  object-fit:cover;
  float:right;
  margin-left:15px
}

.event h3{
  margin-top:0
}

.event .field{
  margin:5px 0
}

.event .label{
  font-weight:bold
}

.incomplete{
  border-left:5px solid #c0392b
}

.complete{
  border-left:5px solid #27ae60
}

.missing{
  color:#c0392b;
  font-weight:bold
}

.source{
  color:#777;
  font-size:12px;
  margin-top:10px
}
</style>
</head>

<body>

<div class="top">
  <input id="url" placeholder="https://www.esempio.it/">
  <button onclick="run()">ANALIZZA</button>
</div>

<div class="wrap" id="results"></div>

<script>
const endpoints = {
  3000: "https://super-system-pvvj4v777rw2rxwg-3000.app.github.dev",
  3002: "https://super-system-pvvj4v777rw2rxwg-3002.app.github.dev",
  3003: "https://super-system-pvvj4v777rw2rxwg-3003.app.github.dev"
};


/*
 * Il Viewer non decide come gli estrattori acquisiscono i dati.
 *
 * Ogni motore può avere una propria risposta tecnica.
 * Qui la risposta viene ricondotta al solo contratto comune:
 *
 *             Schema.org Event
 */


/* ---------------------------------------------------------
   Acquisizione
--------------------------------------------------------- */

async function call(port){

  const u = document.getElementById("url").value.trim();

  if(!u) return null;

  try{

    const r = await fetch(
      endpoints[port] + "/?url=" + encodeURIComponent(u)
    );

    return await r.json();

  }catch(e){

    return {
      error:e.message
    };
  }
}


/* ---------------------------------------------------------
   Conversione output motori -> Schema.org Event
--------------------------------------------------------- */

function extractEvents(data, port){

  if(!data || data.error){
    return [];
  }


  /*
   * SCHEMA / JSON-LD
   *
   * schema.js attualmente restituisce:
   *
   * data.normalizzazione.schema
   *
   * che può contenere array annidati.
   */

  if(port === 3000){

    const schema = data.normalizzazione &&
                   data.normalizzazione.schema;

    if(Array.isArray(schema)){

      const flat = schema.flat(Infinity);

      return flat.filter(item =>
        item &&
        typeof item === "object" &&
        item["@type"] === "Event"
      );
    }

    return [];
  }


  /*
   * STRUCTURED e HTML
   *
   * Il contratto attuale espone direttamente eventi[].
   *
   * In futuro potranno convergere direttamente
   * sullo stesso contratto Schema.org.
   */

  if(Array.isArray(data.eventi)){

    return data.eventi.filter(item =>
      item &&
      typeof item === "object"
    );
  }

  return [];
}


/* ---------------------------------------------------------
   Lettura campi Schema.org
--------------------------------------------------------- */

function value(v){

  if(v === null || v === undefined){
    return "";
  }

  if(typeof v === "string"){
    return v.trim();
  }

  if(typeof v === "object"){

    if(v.name){
      return value(v.name);
    }

    if(v["@value"]){
      return value(v["@value"]);
    }

    return JSON.stringify(v);
  }

  return String(v);
}


function eventTitle(e){

  return value(e.name) ||
         value(e.title);
}


function eventStart(e){

  return value(e.startDate);
}


function eventLocation(e){

  const l = e.location;

  if(!l){
    return "";
  }

  if(typeof l === "string"){
    return l;
  }

  const parts = [];

  if(l.name){
    parts.push(value(l.name));
  }

  const a = l.address;

  if(a){

    if(typeof a === "string"){
      parts.push(a);
    }else{

      [
        "streetAddress",
        "postalCode",
        "addressLocality",
        "addressRegion",
        "addressCountry"
      ].forEach(k => {

        if(a[k]){
          parts.push(value(a[k]));
        }

      });
    }
  }

  return parts.join(", ");
}


function eventOrganizer(e){

  return value(e.organizer);
}


/* ---------------------------------------------------------
   Validazione Viewer
--------------------------------------------------------- */

/*
 * Questi sono criteri del Viewer.
 *
 * Gli estrattori NON devono sapere cosa significa
 * "completo" o "incompleto".
 *
 * Se domani cambiamo i criteri, modifichiamo solo qui.
 */

const requiredFields = [
  "name",
  "startDate",
  "location",
];


function validateEvent(e){

  const missing = [];

  if(!eventTitle(e)){
    missing.push("titolo");
  }

  if(!eventStart(e)){
    missing.push("data/ora");
  }

  if(!eventLocation(e)){
    missing.push("luogo");
  }


  return {
    complete: missing.length === 0,
    missing
  };
}


/* ---------------------------------------------------------
   Deduplicazione
--------------------------------------------------------- */

function eventKey(e){

  return [
    eventTitle(e),
    eventStart(e),
    eventLocation(e)
  ].join("|").toLowerCase();
}


function uniqueEvents(events){

  const seen = new Set();
  const result = [];

  for(const e of events){

    const key = eventKey(e);

    if(seen.has(key)){
      continue;
    }

    seen.add(key);
    result.push(e);
  }

  return result;
}


/* ---------------------------------------------------------
   Visualizzazione evento completo
--------------------------------------------------------- */

function showCompleteEvent(e){

  const title = eventTitle(e);
  const start = eventStart(e);
  const location = eventLocation(e);
  const organizer = eventOrganizer(e);
  const description = value(e.description);
  const image = value(e.image);

  return `
    <div class="event complete">

      ${image ? `<img src="${escapeHtml(image)}">` : ""}

      <h3>${escapeHtml(title || "Evento senza titolo")}</h3>

      <div class="field">
        <span class="label">Data/ora:</span>
        ${escapeHtml(start || "—")}
      </div>

      <div class="field">
        <span class="label">Luogo:</span>
        ${escapeHtml(location || "—")}
      </div>

      <div class="field">
        <span class="label">Organizzatore:</span>
        ${escapeHtml(organizer || "—")}
      </div>

      ${
        description
        ? `<p>${escapeHtml(description)}</p>`
        : ""
      }

    </div>
  `;
}


/* ---------------------------------------------------------
   Visualizzazione evento incompleto
--------------------------------------------------------- */

function showIncompleteEvent(e, validation){

  const title = eventTitle(e);

  return `
    <div class="event incomplete">

      <strong>
        ${escapeHtml(title || "Evento senza titolo")}
      </strong>

      <div class="field">
        Evento rilevato ma incompleto.
      </div>

      <div class="missing">
        Dati fondamentali mancanti:
        ${escapeHtml(validation.missing.join(", "))}
      </div>

    </div>
  `;
}


/* ---------------------------------------------------------
   Visualizzazione motore
--------------------------------------------------------- */

function showEngine(name, events){

  const complete = [];
  const incomplete = [];

  for(const e of events){

    const validation = validateEvent(e);

    if(validation.complete){
      complete.push(e);
    }else{
      incomplete.push({
        event:e,
        validation
      });
    }
  }


  let h = `
    <div class="engine">

      <h2>${name}</h2>

      <div class="summary">

        <span class="marker complete-marker">
          COMPLETI: ${complete.length}
        </span>

        <span class="marker incomplete-marker">
          INCOMPLETI: ${incomplete.length}
        </span>

      </div>
  `;


  for(const e of complete){
    h += showCompleteEvent(e);
  }


  for(const item of incomplete){

    h += showIncompleteEvent(
      item.event,
      item.validation
    );
  }


  if(!events.length){

    h += `
      <p>Nessun evento Schema.org rilevato.</p>
    `;
  }


  h += `</div>`;

  return h;
}


/* ---------------------------------------------------------
   Strutture rilevate
--------------------------------------------------------- */

function structure(html){

  if(!html){
    return "";
  }

  const tests = [

    [
      "JSON-LD",
      /<script\b[^>]*type\s*=\s*["']application\/ld\+json["']/i
    ],

    [
      "Microdata",
      /\bitemscope\b|\bitemprop\s*=/i
    ],

    [
      "RDFa",
      /\btypeof\s*=|\bproperty\s*=/i
    ],

    [
      "OpenGraph",
      /<meta\b[^>]*(?:property\s*=\s*["']og:|name\s*=\s*["']og:)/i
    ],

    [
      "Twitter Card",
      /<meta\b[^>]*name\s*=\s*["']twitter:/i
    ],

    [
      "Meta",
      /<meta\b/i
    ],

    [
      "HTML",
      /<html\b/i
    ],

    [
      "Card",
      /\b(card|event|evento|eventi|appuntamenti|programma)\b/i
    ],

    [
      "Link",
      /<a\b[^>]*href\s*=/i
    ],

    [
      "Immagini",
      /<img\b/i
    ]

  ];


  return `
    <div class="structure">

      <h2>STRUTTURE RILEVATE</h2>

      <div class="badges">

        ${
          tests.map(x => `
            <span class="badge ${x[1].test(html) ? "yes" : "no"}">
              ${x[0]}
            </span>
          `).join("")
        }

      </div>

    </div>
  `;
}


/* ---------------------------------------------------------
   Escape HTML
--------------------------------------------------------- */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ---------------------------------------------------------
   Avvio analisi
--------------------------------------------------------- */

async function run(){

  const r = document.getElementById("results");

  r.innerHTML = "<p>Analisi in corso...</p>";


  const [schemaData, structuredData, htmlData] =
    await Promise.all([

      call(3000),
      call(3002),
      call(3003)

    ]);


  /*
   * La struttura della pagina viene analizzata
   * sul contenuto HTML acquisito.
   */

  const sourceHtml =
    (htmlData && htmlData.content) ||
    (schemaData && schemaData.content) ||
    (structuredData && structuredData.content) ||
    "";


  const schemaEvents =
    uniqueEvents(
      extractEvents(schemaData,3000)
    );


  const structuredEvents =
    uniqueEvents(
      extractEvents(structuredData,3002)
    );


  const htmlEvents =
    uniqueEvents(
      extractEvents(htmlData,3003)
    );


  r.innerHTML =
      structure(sourceHtml)

    + showEngine(
        "SCHEMA / JSON-LD",
        schemaEvents
      )

    + showEngine(
        "MICRODATA / RDFa",
        structuredEvents
      )

    + showEngine(
        "HTML / CARD",
        htmlEvents
      );
}
</script>

</body>
</html>
