<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../aroundo-ui/aroundo-ui.css">  
<title>Aroundo Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  min-height:100vh;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f4f1ea;
  font-family:Arial, sans-serif;
}

.login-box {
  width:280px;
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
  text-align:center;
}

.login-box img {
  width:120px;
  height:120px;
  border-radius:20px;
  margin-bottom:0px;
}

.login-box h2 {
  margin:2px 0 4px;
}
  
input {
  width:100%;
  box-sizing:border-box;
  padding:10px;
  margin:6px 0;
  border:1px solid #ccc;
  border-radius:8px;
}

.action-button {
  display:block;
  width:100%;
  box-sizing:border-box;
  padding:10px;
  border:none;
  border-radius:8px;
  text-decoration:none;
  text-align:center;
  font-family:Arial, sans-serif;
  font-size:16px;
  line-height:normal;
  font-weight:700;
  cursor:pointer;
  margin-top:8px;
}

button.action-button {
  appearance:none;
}
  
.login-action {
  background:#22c55e;
  color:white;
}

.register-action {
  background:#3b82f6;
  color:white;
}

.why-action {
  background:#f59e0b;
  color:white;
}

.login-header {
  display:flex;
  justify-content:flex-start;
  margin-bottom:0;
}

.password-wrapper {
  position:relative;
}

.password-wrapper input {
  padding-right:45px;
}

.password-toggle {
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  width:auto;
  background:none;
  border:none;
  padding:4px;
  cursor:pointer;
  font-size:18px;
  color:#666;
}
  
</style>
</head>
<body>
<div class="login-box">
<div class="login-header">
    <button class="button-back"
            onclick="history.back()"
            aria-label="Back">
    </button>
</div>
  
<img src="../icon-512.png" alt="Aroundo">
<h2>Aroundo</h2>
<div style="
    margin-top:4px;
    margin-bottom:8px;
    font-size:14px;
    color:#666;
    letter-spacing:.5px;
">
    Explore • Discover • Experience
</div>
<input 
 id="email"
 type="email"
 placeholder="Email">

<input
  <div class="password-wrapper">
    <input
     id="password"
     type="password"
     placeholder="Password">
    <button 
      type="button"
      id="togglePassword"
      class="password-toggle"
      aria-label="Show password">
      👁
    </button>
  </div>
  
<button id="loginBtn" class="action-button login-action">
Login
</button>

<br>Don't have an account yet?<br>
 
<a href="#" id="registerLink" class="action-button register-action">
Register
</a>  
  
<a href="why-aroundo.html" class="action-button why-action">
Why Aroundo?
</a>
  
<div style="
    margin-top:25px;
    font-size:11px;
    color:#999;
    text-align:center;
">
    Aroundo is continuously evolving.<br>
    New features will become available over time.
</div>  
</div>


  
<!-- LOGIN ERROR DIALOG -->
  <div id="loginErrorDialog" style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    z-index:99999;
    align-items:center;
    justify-content:center;
  ">
  <div style="
    background:white;
    padding:22px;
    border-radius:12px;
    width:300px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
  ">
  <div id="loginErrorTitle" style="
    margin-bottom:15px;
    font-weight:700;
    color:#ef4444;
    font-size:16px;
    ">
  </div>      
    <div id="loginErrorMessage" style="
      margin-bottom:18px;
      color:#555;
      font-size:13px;
    ">
  </div>
    <button id="loginErrorOkBtn" style="
      width:100%;
      background:#22c55e;
      color:white;
      border:none;
      padding:10px;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
    ">
      OK
    </button>
  </div>
</div>

<script type="module">
  import { requireAuth } from './auth-check.js';
  import { supabase } from '../supabase.js';
  await requireAuth({
    redirectIfLogged: true,
    allowGuest: true
  });

document.getElementById('togglePassword')
.addEventListener('click', () => {
  const password =
  document.getElementById('password');
  if(password.type === "password"){
      password.type = "text";
  } else {
      password.type = "password";
  }
});
  
document.getElementById('loginErrorOkBtn').addEventListener('click', () => {
  document.getElementById('loginErrorDialog').style.display = 'none';
});
  
document.getElementById('registerLink').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('loginErrorTitle').textContent = 'Register';
  document.getElementById('loginErrorMessage').textContent =
  'User registration will be available soon.';
  document.getElementById('loginErrorDialog').style.display = 'flex';
});

document.getElementById('loginBtn').addEventListener('click', async () => {
const email =
document.getElementById('email').value;

const password =
document.getElementById('password').value;
const { error } =
await supabase.auth.signInWithPassword({
 email,
 password
});
  
if(error) {
  document.getElementById('loginErrorTitle').textContent = 'Invalid login';
  document.getElementById('loginErrorMessage').textContent = 'Invalid email or password.';
  document.getElementById('loginErrorDialog').style.display = 'flex';
 return;
}

window.location.href="dashboard.html";
});

</script>
</body>
</html>
