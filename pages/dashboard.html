body {
  margin:0;

.container {
  display:flex;
  min-height:100vh;
}

.sidebar {
  width:220px;
  background:#1f2937;
  color:white;
  padding:20px;
}

.sidebar h2 {

  margin-bottom:20px;

.sidebar a {

  color:white;
  text-decoration:none;
  padding:8px 0;

.sidebar a:hover {

  flex:1;

/* MOBILE */

  .container{
    flex-direction:column;

  .sidebar{
    width:auto;

  }

  .sidebar nav{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:5px;
  }

  .sidebar a{
    padding:10px;
    text-align:center;
    background:#374151;
    border-radius:8px;
  }

  .content{
    padding:15px;
  }
}

#logoutBtn{
  cursor:pointer;
}

  <div class="container">

<!-- MESSAGE DIALOG -->
<div id="messageDialog" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
z-index:99999;
align-items:center;
justify-content:center;
">
<div style="
background:white;
padding:22px;
border-radius:12px;
width:300px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
">
<div id="messageText" style="
margin-bottom:18px;
font-weight:600;
">
</div>

<button onclick="closeMessage()" style="
width:100%;
background:#3b82f6;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
font-weight:600;
">
OK
</button>
</div>
</div>

<div id="logoutDialog" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
z-index:99999;
align-items:center;
justify-content:center;
">
<div style="
background:white;
padding:22px;
border-radius:12px;
width:300px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
">
<div style="margin-bottom:18px;font-weight:600;">
Confirm exit?
</div>

<button onclick="confirmLogout(true)" style="
width:45%;
background:#22c55e;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
font-weight:600;
">
Yes
</button>

<button onclick="confirmLogout(false)" style="
width:45%;
background:#ef4444;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
font-weight:600;
">
No
</button>

</div>
</div>

<script type="module">
import { requireAuth } from './auth-check.js';
  await requireAuth(); 
  
import { supabase } from '../supabase.js';

import { logout } from './auth-check.js';

// CANCELLARE DUPLICATO   const { data, error } = await supabase.auth.getSession();
//    if (error || !data.session) {
//      window.location.href = "login.html";
//    }

window.showMessage=function(text){
document.getElementById("messageText").textContent=text;
document.getElementById("messageDialog").style.display="flex";
}

window.closeMessage=function(){
document.getElementById("messageDialog").style.display="none";
}
  
document.querySelectorAll('.in-progress').forEach(link => {
  link.addEventListener('click', function(event) {
    event.preventDefault();
    showMessage("In Progress!");    
  });
});

document.getElementById("logoutBtn").onclick=async function(e){
  e.preventDefault();
  document.getElementById("logoutDialog").style.display="flex";
};  
  
window.confirmLogout=async function(value){
  document.getElementById("logoutDialog").style.display="none";
  if(value){
    await logout();
    window.location.href="../index.html";
  }
};
  
</script>
