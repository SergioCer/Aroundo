<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../aroundo-ui/aroundo-ui.css">
<title>Why Aroundo?</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
  margin:0;
  min-height:100vh;
  background:#f4f1ea;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#333;
}

.container {
  width:90%;
  max-width:520px;
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 6px 20px rgba(0,0,0,.12);
}

.logo {
  text-align:center;
}

.logo img {
  width:90px;
  height:90px;
  border-radius:18px;
}

.lang {
  text-align:right;
  margin-top:10px;
  margin-bottom:20px;
}

h1 {
  text-align:center;
  font-size:26px;
  margin:10px 0 20px;
}

details {
  background:#f8fafc;
  border-radius:10px;
  padding:12px;
  margin-bottom:4px;
}

summary {
  cursor:pointer;
  font-weight:700;
  color:#2563eb;
}

details p {
  color:#555;
  font-size:14px;
  line-height:1.55;
}

details li {
  color:#555;
  font-size:14px;
  margin-bottom:5px;
}

.final-message {
  margin-top:30px;
  margin-bottom:20px;
  text-align:center;
  font-size:15px;
  color:#555;
  font-style:italic;
  line-height:1.5;
}

.button {
  display:block;
  text-align:center;
  background:#22c55e;
  color:white;
  padding:10px;
  border-radius:20px;
  text-decoration:none;
  font-weight:700;
}

.back {
  text-align:center;
  margin-top:15px;
}

.back a {
  color:#666;
  font-size:13px;
}

</style>
</head>
<body>

<div class="container">
  
<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:4px;
">
<button
    class="button-back"
    onclick="history.back()"
    aria-label="Back">
</button>
<select id="languageSelector"
        style="
        padding:6px 10px;
        border:1px solid #d1d5db;
        border-radius:8px;
        background:white;
        font-size:14px;
        cursor:pointer;
        ">
</select>
</div>
  
<div class="logo">
<img src="../icon-512.png" alt="Aroundo">
</div>
  
<h1 data-lang="pageTitle"></h1>

<details open>
<summary data-lang="whatTitle"></summary>
<p data-lang="whatText1"></p>
<p data-lang="whatText2"></p>
</details>


<details>
<summary data-lang="participateTitle"></summary>
<p data-lang="participateText1"></p>
<p data-lang="participateText2"></p>
</details>


<details>
<summary data-lang="userTitle"></summary>
<p data-lang="userText1"></p>
<p data-lang="userText2"></p>
<ul>
<li data-lang="userList1"></li>
<li data-lang="userList2"></li>
<li data-lang="userList3"></li>
<li data-lang="userList4"></li>
</ul>
</details>

<details>
<summary data-lang="creatorTitle"></summary>
<p data-lang="creatorText1"></p>
<p data-lang="creatorText2"></p>
<p data-lang="creatorText3"></p>
</details>

<details>
<summary data-lang="organizerTitle"></summary>
<p data-lang="organizerText1"></p>
<p data-lang="organizerText2"></p>
</details>


<details>
<summary data-lang="placeManagerTitle"></summary>
<p data-lang="placeManagerText1"></p>
<p data-lang="placeManagerText2"></p>
<p data-lang="placeManagerText3"></p>
</details>

<details>
<summary data-lang="serviceProviderTitle"></summary>
<p data-lang="serviceProviderText1"></p>
<p data-lang="serviceProviderText2"></p>
</details>

<details>
<summary data-lang="trustTitle"></summary>
<p data-lang="trustText1"></p>
<p data-lang="trustText2"></p>
<p data-lang="trustText3"></p>
</details>

<div style="
margin-top:16px;
margin-bottom:16px;
text-align:center;
font-size:15px;
color:#555;
font-style:italic;
line-height:1.5;
">
<span data-lang="finalMessage1"></span>
<br>
<span data-lang="finalMessage2"></span>
</div>

<div class="button">
<a href="login.html"
   data-lang="backToLogin">
</a>
</div>

<script>
const details = document.querySelectorAll("details");

details.forEach((targetDetail)=>{
targetDetail.addEventListener("toggle",()=>{
if(targetDetail.open){
details.forEach((detail)=>{
if(detail !== targetDetail){
detail.removeAttribute("open");
}
});
}
});
});
</script>
  
<script type="module">
import { initLanguage }
from "../aroundo-ui/language.js";
initLanguage();
</script>
  
</body>
</html>
