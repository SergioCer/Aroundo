<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../aroundo-ui/aroundo-ui.css">
<title>Why Aroundo?</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
  margin:0;
  min-height:100vh;
  background:#f4f1ea;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#333;
}

.container {
  width:90%;
  max-width:520px;
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 6px 20px rgba(0,0,0,.12);
}

.logo {
  text-align:center;
}

.logo img {
  width:90px;
  height:90px;
  border-radius:18px;
}

.lang {
  text-align:right;
  margin-top:10px;
  margin-bottom:20px;
}

h1 {
  text-align:center;
  font-size:26px;
  margin:10px 0 14px;
}

details {
  background:#f8fafc;
  border-radius:10px;
  padding:8px;
  margin-bottom:4px;
}

summary {
  cursor:pointer;
  font-weight:700;
  color:#2563eb;
}

details p {
  color:#555;
  font-size:14px;
  line-height:1.25;
}

details li {
  color:#555;
  font-size:14px;
  margin-bottom:5px;
}

.final-message {
  margin-top:30px;
  margin-bottom:20px;
  text-align:center;
  font-size:15px;
  color:#555;
  font-style:italic;
  line-height:1.5;
}

.button {
  display:block;
  text-align:center;
  background:#22c55e;
  color:white;
  padding:10px;
  border-radius:20px;
  text-decoration:none;
  font-weight:700;
}

.back {
  text-align:center;
  margin-top:15px;
}

.back a {
  color:#666;
  font-size:13px;
}

.language-selector {
  position:relative;
  direction:ltr;
}

#languageButton {
  padding:6px 12px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:#ecf3fb;
  font-size:16px;
  cursor:pointer;
  min-width:120px;
  direction:ltr;
}

#languageMenu {
  display:none;
  position:absolute;
  right:0;
  top:42px;
  background:white;
  border:1px solid #d1d5db;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
  overflow:hidden;
  z-index:100;
  min-width:150px;
  direction:ltr;
}

#languageMenu  {
  width:100%;
  border:0;
  background:white;
  padding:10px 14px;
  text-align:left;
  font-size:15px;
  cursor:pointer;
}

#languageMenu :hover {
  background:#ecf3fb;
}

.top-bar {
  margin-bottom:2px;
  direction:ltr;
}  

@media(max-width:600px){

  #language {
    font-size:14px;
    min-width:100px;
    padding:6px 8px;
  }

  #languageMenu {
    min-width:130px;
  }

}

</style>
</head>
<body>

<div class="container">

<div class="top-bar">  
  <div style="
  display:flex;
  justify-content:space-between;
  align-items:center;
  ">
  < class="button-back" onclick="history.back()" aria-label="Back">←</button>
        <div class="language-selector">
  <button id="languageButton"></button>
        <div id="languageMenu">
      </div>
    </div>  
  </div>
</div>  
  
<div class="logo">
  <img src="../icon-512.png" alt="Aroundo">
</div>
  
<h1 data-lang="pageTitle"></h1>

<details open>
<summary data-lang="whatTitle"></summary>
<p data-lang="whatText1"></p>
<p data-lang="whatText2"></p>
</details>


<details>
<summary data-lang="participateTitle"></summary>
<p data-lang="participateText1"></p>
<p data-lang="participateText2"></p>
</details>


<details>
<summary data-lang="userTitle"></summary>
<p data-lang="userText1"></p>
<p data-lang="userText2"></p>
<p data-lang="userText3"></p>
<ul>
<li data-lang="userList1"></li>
<li data-lang="userList2"></li>
<li data-lang="userList3"></li>
<li data-lang="userList4"></li>
</ul>
</details>

<details>
<summary data-lang="organizerTitle"></summary>
<p data-lang="organizerText1"></p>
<p data-lang="organizerText2"></p>
</details>

<details>
<summary data-lang="placeManagerTitle"></summary>
<p data-lang="placeManagerText1"></p>
<p data-lang="placeManagerText2"></p>
<p data-lang="placeManagerText3"></p>
</details>

<details>
<summary data-lang="creatorTitle"></summary>
<p data-lang="creatorText1"></p>
<p data-lang="creatorText2"></p>
<p data-lang="creatorText3"></p>
</details>

<details>
<summary data-lang="serviceProviderTitle"></summary>
<p data-lang="serviceProviderText1"></p>
<p data-lang="serviceProviderText2"></p>
</details>

<details>
<summary data-lang="trustTitle"></summary>
<p data-lang="trustText1"></p>
<p data-lang="trustText2"></p>
<p data-lang="trustText3"></p>
</details>

<details>
<summary data-lang="publishingTitle"></summary>
<p data-lang="publishingText1"></p>
<p data-lang="publishingText2"></p>
<p data-lang="publishingText3"></p>
<p data-lang="publishingText4"></p>
<p><strong data-lang="publishingSubtitle"></strong></p>
<p data-lang="publishingText5"></p>
<p data-lang="publishingText6"></p>
<ul>
<li data-lang="publishingList1"></li>
<li data-lang="publishingList2"></li>
<li data-lang="publishingList3"></li>
<li data-lang="publishingList4"></li>
</ul>
</details>
  
<div style="
margin-top:16px;
margin-bottom:16px;
text-align:center;
font-size:15px;
color:#555;
font-style:italic;
line-height:1.5;
">
<span data-lang="finalMessage1"></span>
<br>
<span data-lang="finalMessage2"></span>
</div>

<a
href="login.html"
class="button"
data-lang="backToLogin">
</a>
  
<script>
const details = document.querySelectorAll("details");

details.forEach((targetDetail)=>{
targetDetail.addEventListener("toggle",()=>{
if(targetDetail.open){
details.forEach((detail)=>{
if(detail !== targetDetail){
detail.removeAttribute("open");
}
});
}
});
});
</script>
  
<script type="module">
import { initLanguage }
from "../aroundo-ui/language.js";
initLanguage();
</script>
  
</body>
</html>
