<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyAroundo</title>
  <script>
    /* GitHub Pages ci ha portato qui perché l'URL
     * richiesto non corrisponde ad un file fisico.
     * Intercettiamo soltanto:
     * /MyAroundo/SLUG */
    const path = location.pathname;
    const marker = "/MyAroundo/";
    if (path.startsWith(marker)) {
      const slug = path
        .substring(marker.length)
        .replace(/^\/+|\/+$/g, "");
      if (slug && !slug.includes("/")) {
        const target =
          "/MyAroundo/index.html?slug=" +
          encodeURIComponent(slug);
        location.replace(target);
      } else {
        location.replace("/404.html");
      }
    } else {
      document.addEventListener("DOMContentLoaded", () => {
        document.body.innerHTML = `
          <div style="
            font-family:Arial,Helvetica,sans-serif;
            text-align:center;
            padding:60px 20px;
          ">
            <h1>404</h1>
            <p>Pagina non trovata.</p>
          </div>
        `;
      });
    }
  </script>
</head>
<body>
</body>
</html>
