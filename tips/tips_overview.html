<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0"/>

<title>Tips Admin</title>

<style>

body {
  font-family: Arial;
  background: #f6f8fb;
  margin: 0;
}

.header {
  display: flex;
  justify-content: center;
  padding: 10px;
}

.title {
  font-size: 24px;
  font-weight: bold;
  display: flex;
  gap: 20px;
  align-items: center;
}

.add-btn,
.bck-btn {
  width: 34px;
  height: 34px;
  border-radius: 17px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.add-btn {
  background: #22c55e;
  color: white;
  font-size: 22px;
}

.add-btn:hover {
  background: #16a34a;
}

.bck-btn {
  background: #e5e7eb;
  color: #374151;
  font-size: 18px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  table-layout: fixed;
}

th,
td {
  padding: 6px;
  border-bottom: 1px solid #e5e7eb;
  overflow: hidden;
}

tr:hover {
  background: #eef6ff;
  cursor: pointer;
}

td {
  white-space: nowrap;
  text-overflow: ellipsis;
  border-right: 2px solid #f1f5f9;
}

.col-header {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.col-title {
  display: flex;
  justify-content: space-between;
  font-weight: bold;
  font-size: 14px;
}

.filter {
  width: 100%;
  font-size: 12px;
  padding: 6px;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  box-sizing: border-box;
}

.sort-btn {
  width: 28px;
  height: 28px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  background: #dbeafe;
  color: #1e3a8a;
}

.reset-btn,
.status-filter {
  width: 28px;
  height: 28px;
  border-radius: 14px;
  cursor: pointer;
}

.reset-btn {
  border: 1px solid #d1d5db;
  background: #f3f4f6;
  opacity: .5;
}

.reset-btn.active {
  background: #fbbf24;
  opacity: 1;
}

.status-filter {
  border: none;
  background: #dbeafe;
}

.status-ok {
  color: #22c55e;
}

.status-no {
  color: #ef4444;
}

</style>
</head>
<body>

<div class="header">
  <div class="title">
    <button
      class="bck-btn"
      onclick="location.href='../pages/dashboard.html'">
      ←
    </button>
    Tips
    <button
      class="add-btn"
      onclick="location.href='tips.html?new=1'">
      +
    </button>
  </div>
</div>
<table>
<colgroup>
  <col style="width:60px">
  <col style="width:280px">
  <col style="width:100px">
  <col style="width:120px">
  <col style="width:80px">
  <col style="width:80px">
  <col style="width:80px">
  <col style="width:60px">
</colgroup>
<thead>
<tr>
<th>
  <div class="col-header">
    <div class="col-title"
         style="justify-content:center">
      ID
    </div>
    <button
      class="reset-btn"
      onclick="resetAll()"
      id="resetBtn">
      •
    </button>
  </div>
</th>
<th>
  <div class="col-header">
    <div class="col-title">
      Testo
      <button
        class="sort-btn"
        onclick="sort('tp_text')">
        ↕
      </button>
    </div>
    <input
      class="filter"
      id="filterText"
      oninput="setFilter('tp_text',this.value)">
  </div>
</th>
<th>
  <div class="col-header">
    <div class="col-title">
      Tipo
    </div>
    <input
      class="filter"
      id="filterType"
      oninput="setFilter('tp_type',this.value)">
  </div>
</th>
<th>
  <div class="col-header">
    <div class="col-title">
      Analytics
    </div>
    <input
      class="filter"
      id="filterAnalytics"
      oninput="setFilter('tp_analytics',this.value)">
  </div>
</th>
<th>
  <div class="col-title">
    Repeat
    <button
      class="sort-btn"
      onclick="sort('tp_repeat')">
      ↕
    </button>
  </div>
</th>
<th>
  <div class="col-title">
    Interval
    <button
      class="sort-btn"
      onclick="sort('tp_interval')">
      ↕
    </button>
  </div>
</th>
<th>
  <div class="col-title">
    Growth
    <button
      class="sort-btn"
      onclick="sort('tp_growth')">
      ↕
    </button>
  </div>
</th>
<th>
  <div class="col-header">
    <div class="col-title"
         style="justify-content:center">
      Stato
    </div>
    <button
      class="status-filter"
      onclick="toggleActive()"
      id="activeBtn">
      ●
    </button>
  </div>
</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script type="module">
import { requireAuth }
  from "../pages/auth-check.js";

await requireAuth();

import { supabase }
  from "../supabase.js";

import {
  getTipTypes,
  getAnalyticsFields
} from "./tips.js";

let data = [];
let state = {
  filters: {},
  sortField: null,
  sortDir: "asc",
  active: "all"
};

/* LOAD */
async function load() {
  const { data: rows, error } =
    await supabase
      .from("tips")
      .select("*");
  if (error) {
    console.error(error);
    return;
  }
  data = rows || [];
  render();
}

/* SORT */
window.sort = field => {
  if (state.sortField !== field) {
    state.sortField = field;
    state.sortDir = "asc";
  } else {
    state.sortDir =
      state.sortDir === "asc"
        ? "desc"
        : "asc";
  }
  render();
};

/* FILTER */
window.setFilter = (field,value) => {
  state.filters[field] = value;
  render();
};

/* RESET */
window.resetAll = () => {
  state.filters = {};
  state.sortField = null;
  state.sortDir = "asc";
  state.active = "all";
  document
    .querySelectorAll(".filter")
    .forEach(x => x.value = "");
  render();
};

/* ACTIVE */
window.toggleActive = () => {
  if (state.active === "all")
    state.active = "true";
  else if (state.active === "true")
    state.active = "false";
  else
    state.active = "all";
  render();
};

/* RENDER */
function render() {
  let filtered = [...data];
  if (state.active === "true")
    filtered =
      filtered.filter(x => x.tp_active === true);
  if (state.active === "false")
    filtered =
      filtered.filter(x => x.tp_active === false);
  Object.entries(state.filters)
    .forEach(([key,value]) => {
      const v =
        String(value || "").toLowerCase();
      if (!v) return;
      filtered =
        filtered.filter(row =>
          String(row[key] ?? "")
            .toLowerCase()
            .includes(v)
        );
    });
  if (state.sortField) {
    filtered.sort((a,b) => {
      const va = a[state.sortField];
      const vb = b[state.sortField];
      if (va === vb) return 0;
      const result =
        va > vb ? 1 : -1;
      return state.sortDir === "asc"
        ? result
        : -result;
    });
  }

  const tbody =
    document.getElementById("tbody");
  tbody.innerHTML = "";
  filtered.forEach(row => {
    const tr =
      document.createElement("tr");
    tr.onclick = () =>
      location.href =
        `tips.html?id=${encodeURIComponent(row.id_tips)}`;
    const type =
      getTipTypes()
        .find(x => x.value === row.tp_type);
    const active =
      row.tp_active
        ? '<span class="status-ok">✔</span>'
        : '<span class="status-no">✖</span>';
    tr.innerHTML = `
      <td>${row.id_tips || ""}</td>
      <td>${row.tp_text || ""}</td>
      <td>${type?.label || row.tp_type || ""}</td>
      <td>${row.tp_analytics || ""}</td>
      <td>${row.tp_repeat ?? ""}</td>
      <td>${row.tp_interval ?? ""}</td>
      <td>${row.tp_growth ?? ""}</td>
      <td style="text-align:center">
        ${active}
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("activeBtn").textContent =
    state.active === "all"
      ? "●"
      : state.active === "true"
        ? "✔"
        : "✖";

  const reset =
    document.getElementById("resetBtn");
  const hasFilters =
    Object.values(state.filters)
      .some(Boolean)
    ||
    state.active !== "all"
    ||
    state.sortField !== null;
  reset.classList.toggle(
    "active",
    hasFilters
  );
  reset.textContent =
    hasFilters ? "↺" : "•";
}

load();
</script>
</body>
</html>
