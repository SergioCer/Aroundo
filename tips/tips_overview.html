<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tips Admin</title>
<style>

body {
  font-family: Arial;
  background: #f6f8fb;
  margin: 0;
}

.header {
  display: flex;
  justify-content: center;
  padding: 10px;
}

.title {
  font-size: 24px;
  font-weight: bold;
  display: flex;
  gap: 20px;
  align-items: center;
}

.add-btn,
.bck-btn {
  width: 34px;
  height: 34px;
  border-radius: 17px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.add-btn {
  background: #22c55e;
  color: white;
  font-size: 22px;
}

.add-btn:hover {
  background: #16a34a;
}

.bck-btn {
  background: #e5e7eb;
  color: #374151;
  font-size: 18px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  table-layout: fixed;
}

th,
td {
  padding: 6px 10px;
  border-bottom: 1px solid #e5e7eb;
  overflow: hidden;
}

th {
  font-weight: normal;
  vertical-align: middle;
}
  
tr:hover {
  background: #eef6ff;
  cursor: pointer;
}

td {
  white-space: nowrap;
  text-overflow: ellipsis;
  border-right: 2px solid #f1f5f9;
}

/* Header a due righe */
.header-title {
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: normal;
}

.header-controls {
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Ricerca + sort */
.search-sort {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
}

.search-sort .filter {
  flex: 1;
  min-width: 0;
}  
  
.col-header {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.col-title {
  display: flex;
  justify-content: space-between;
  font-weight: bold;
  font-size: 14px;
}

.filter {
  width: 100%;
  font-size: 12px;
  padding: 6px;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  box-sizing: border-box;
}

.sort-btn {
  flex: 0 0 28px;
  width: 28px;
  height: 28px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  background: #dbeafe;
  color: #1e3a8a;
}

/* Celle numeriche */
.numeric {
  text-align: right;
}
  
.reset-btn,
.status-filter {
  width: 28px;
  height: 28px;
  border-radius: 14px;
  cursor: pointer;
}

.reset-btn {
  border: 1px solid #d1d5db;
  background: #f3f4f6;
  opacity: .5;
}

.reset-btn.active {
  background: #fbbf24;
  opacity: 1;
}

.status-filter {
  border: none;
  background: #dbeafe;
}

.status-ok {
  color: #22c55e;
}

.status-no {
  color: #ef4444;
}

</style>
</head>
<body>

<div class="header">
  <div class="title">
    <button
      class="bck-btn"
      onclick="location.href='../pages/dashboard.html'">
      ←
    </button>
    Tips
    <button
      class="add-btn"
      onclick="location.href='tips.html?new=1'">
      +
    </button>
  </div>
</div>
<table>
<colgroup>
  <col style="width:50px">
  <col style="width:380px">
  <col style="width:180px">
  <col style="width:100px">
  <col style="width:110px">
  <col style="width:110px">
  <col style="width:90px">
</colgroup>
<thead>
<tr>
  <!-- RESET -->
  <th rowspan="2">
    <button
      class="reset-btn"
      onclick="resetAll()"
      id="resetBtn">
      •
    </button>
  </th>
  <!-- TITLE -->
  <th>
    <div class="header-title">
      Title
    </div>
  </th>
  <!-- TYPE -->
  <th>
    <div class="header-title">
      Type
    </div>
  </th>
  <!-- REPEAT -->
  <th>
    <div class="header-title">
      Repeat
    </div>
  </th>
  <!-- INTERVAL -->
  <th>
    <div class="header-title">
      Interval
    </div>
  </th>
  <!-- GROWTH -->
  <th>
    <div class="header-title">
      Growth
    </div>
  </th>
  <!-- ACTIVE -->
  <th>
    <div class="header-title">
      Active
    </div>
  </th>
</tr>
<tr>
  <!-- TITLE FILTER + SORT -->
  <th>
    <div class="header-controls">
      <div class="search-sort">
        <input
          class="filter"
          id="filterText"
          oninput="setFilter('tp_text',this.value)">
        <button
          class="sort-btn"
          onclick="sort('tp_text')">
          ↕
        </button>
      </div>
    </div>
  </th>
  <!-- TYPE FILTER + SORT -->
  <th>
    <div class="header-controls">
      <div class="search-sort">
        <input
          class="filter"
          id="filterType"
          oninput="setFilter('tp_type',this.value)">
        <button
          class="sort-btn"
          onclick="sort('tp_type')">
          ↕
        </button>
      </div>
    </div>
  </th>
  <!-- REPEAT SORT -->
  <th>
    <div class="header-controls">
      <button
        class="sort-btn"
        onclick="sort('tp_repeat')">
        ↕
      </button>
    </div>
  </th>
  <!-- INTERVAL SORT -->
  <th>
    <div class="header-controls">
      <button
        class="sort-btn"
        onclick="sort('tp_interval')">
        ↕
      </button>
    </div>
  </th>
  <!-- GROWTH SORT -->
  <th>
    <div class="header-controls">
      <button
        class="sort-btn"
        onclick="sort('tp_growth')">
        ↕
      </button>
    </div>
  </th>
  <!-- ACTIVE FILTER -->
  <th>
    <div class="header-controls">
      <button
        class="status-filter"
        onclick="toggleActive()"
        id="activeBtn">
        ●
      </button>
    </div>
  </th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script type="module">
import { requireAuth } from "../pages/auth-check.js";

await requireAuth();

import { supabase } from "../supabase.js";

import {getTipTypes, getAnalyticsFields} from "./tips.js";

let data = [];
let state = {filters: {}, sortField: null, sortDir: "asc", active: "all"};

/* LOAD */
async function load() {
  const { data: rows, error } = await supabase .from("tips") .select("*");
  if (error) {console.error(error); return;}
  data = rows || [];
  render();
}

/* SORT */
window.sort = field => {if (state.sortField !== field) {state.sortField = field; state.sortDir = "asc";
  } else {state.sortDir = state.sortDir === "asc" ? "desc" : "asc";}
  render();
};

/* FILTER */
window.setFilter = (field,value) => {state.filters[field] = value; render();};

/* RESET */
window.resetAll = () => {state.filters = {}; state.sortField = null; state.sortDir = "asc"; state.active = "all"; document .querySelectorAll(".filter") .forEach(x => x.value = "");
  render();
};

/* ACTIVE */
window.toggleActive = () => {if (state.active === "all") state.active = "true";
  else if (state.active === "true") state.active = "false";
  else state.active = "all";
  render();
};

/* RENDER */
function render() {
  let filtered = [...data];
  if (state.active === "true")
    filtered = filtered.filter(x => x.tp_active === true);
  if (state.active === "false")
    filtered = filtered.filter(x => x.tp_active === false);
  Object.entries(state.filters)
    .forEach(([key,value]) => {const v = String(value || "").toLowerCase(); if (!v) return;
      filtered = filtered.filter(row => String(row[key] ?? "") .toLowerCase() .includes(v));
    });
  if (state.sortField) {
    filtered.sort((a,b) => {
      const va = a[state.sortField];
      const vb = b[state.sortField];
      if (va === vb) return 0;
      const result = va > vb ? 1 : -1;
      return state.sortDir === "asc" ? result : -result;});
  }
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  filtered.forEach(row => {const tr = document.createElement("tr");
    tr.onclick = () => location.href = `tips.html?id=${encodeURIComponent(row.id_tips)}`;
    const type = getTipTypes() .find(x => x.value === row.tp_type);
    const active = row.tp_active ? '<span class="status-ok">✔</span>' : '<span class="status-no">✖</span>';
    tr.innerHTML = `
      <td>${row.tp_text || ""}</td>
      <td>${type?.label || row.tp_type || ""}</td>
      <td class="numeric">${row.tp_repeat ?? ""}</td>
      <td class="numeric">${row.tp_interval ?? ""}</td>
      <td class="numeric">${row.tp_growth ?? ""}</td>
      <td style="text-align:center">
        ${active}
      </td>`;
    tbody.appendChild(tr);
  });
  document.getElementById("activeBtn").textContent =
    state.active === "all" ? "●" : state.active === "true" ? "✔" : "✖";
  const reset = document.getElementById("resetBtn");
  const hasFilters = Object.values(state.filters)
      .some(Boolean) ||
    state.active !== "all" ||
    state.sortField !== null;
  reset.classList.toggle("active", hasFilters);
  reset.textContent = hasFilters ? "↺" : "•";
}

load();
</script>
</body>
</html>
