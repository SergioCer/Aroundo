<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Tip</title>
<style>

body {
  font-family: Arial;
  background: #f6f8fb;
  margin: 0;
}

.header {
  display: flex;
  justify-content: center;
  padding: 10px;
}

.title {
  font-size: 24px;
  font-weight: bold;
  display: flex;
  gap: 20px;
  align-items: center;
}

.bck-btn,
.save-btn {
  width: 34px;
  height: 34px;
  border-radius: 17px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.bck-btn {
  background: #e5e7eb;
  color: #374151;
  font-size: 18px;
}

.save-btn {
  background: #22c55e;
  color: white;
  font-size: 18px;
}

.container {
  max-width: 900px;
  margin: 20px auto;
  padding: 20px;
  background: white;
  border-radius: 12px;
}

.row {
  display: flex;
  gap: 15px;
  margin-bottom: 15px;
}

.field {
  flex: 1;
}

label {
  display: block;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 5px;
}

input,
select,
textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 9px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-family: inherit;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.preview {
  margin-top: 25px;
  padding: 15px;
  background: #f6f8fb;
  border-radius: 10px;
}

.preview-title {
  font-weight: bold;
  margin-bottom: 10px;
}

.progression {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.step {
  background: #dbeafe;
  color: #1e3a8a;
  padding: 7px 12px;
  border-radius: 15px;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
}

.status input {
  width: auto;
}

.simulation {
  margin-top: 15px;
  display: grid;
  gap: 6px;
}

.simulation-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 10px;
  background: #f6f8fb;
  border-radius: 8px;
}

.simulation-value {
  font-weight: bold;
}

.simulation-main {
  background: #dcfce7;
  color: #166534;
}

.tip-tools {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 25px;
}

.tool-btn {
  width: 34px;
  height: 34px;
  border-radius: 17px;
  border: none;
  cursor: pointer;
  color: white;
  font-size: 16px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
}

.progression-btn {
  background: #3b82f6;
}

.progression-btn:hover {
  background: #2563eb;
}

.preview-btn {
  background: #22c55e;
}

.preview-btn:hover {
  background: #16a34a;
}

.active-on {
  background: #22c55e;
}

.active-on:hover {
  background: #16a34a;
}

.active-off {
  background: #ef4444;
}

.active-off:hover {
  background: #dc2626;
}

.progression {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.step {
  background: #dbeafe;
  color: #1e3a8a;
  padding: 7px 12px;
  border-radius: 15px;
}
  
</style>
</head>
<body>

<div class="header">
  <div class="title">
    <button
      class="bck-btn"
      onclick="location.href='tips_overview.html'">
      ←
    </button>
    <span id="pageTitle">
      New Tip
    </span>
    <button
      class="save-btn"
      onclick="save()">
      ✓
    </button>
  </div>
</div>
<div class="container">
  <div class="field">
    <label>Tip ID</label>
    <input
      id="id_tips"
      placeholder="e.g. 20260809 Welcome">
  </div>
  <br>
  <div class="field">
    <label>Text</label>
    <textarea
      id="tp_text"
      placeholder="Message text...">
    </textarea>
  </div>
  <div class="row">
    <div class="field">
      <label>Type</label>
      <select id="tp_type"></select>
    </div>
    <div class="field">
      <label>Analytics</label>
      <select id="tp_analytics"></select>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>Condition</label>
      <select id="tp_condition">
        <option value="=">=</option>
        <option value="!=">!=</option>
        <option value=">">></option>
        <option value=">=">>=</option>
        <option value="<"><</option>
        <option value="<="><=</option>
      </select>
    </div>
    <div class="field">
      <label>Valore</label>
      <input
        id="tv_value"
        placeholder="e.g. 10 or true">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>Repeat</label>
      <input
        id="tp_repeat"
        type="number"
        min="0"
        value="1">
    </div>
    <div class="field">
      <label>Interval</label>
      <input
        id="tp_interval"
        type="number"
        min="1"
        value="1">
    </div>
    <div class="field">
      <label>Growth</label>
      <input
        id="tp_growth"
        type="number"
        step="0.1"
        value="1">
    </div>
  </div>
  
<div class="tip-tools">
  <button
    id="impactBtn"
    class="tool-btn progression-btn"
    type="button"
    title="Estimated Impact">
    ↗
  </button>
  <button
    id="activeBtn"
    class="tool-btn"
    type="button"
    title="Tip inactive">
    ●
  </button>
  <button
    id="previewBtn"
    class="tool-btn preview-btn"
    type="button"
    title="Preview Tip">
    ▶
  </button>
</div>
<div
  id="progression"
  class="progression">
</div>
  <div
  id="simulation"
  class="simulation">
</div>
</div>

<script type="module">

import {requireAuth} from "../pages/auth-check.js";

await requireAuth();

import {
  getTipTypes,
  getAnalyticsFields,
  calculateProgression,
  defaultTip,
  loadTip,
  saveTip,
  simulateTip,
  renderTip
} from "./tips.js";


let tip = defaultTip();


const params = new URLSearchParams(location.search);

const id =params.get("id");
const isNew =params.get("new") === "1";

/* ELEMENTS */
const idTips = document.getElementById("id_tips");

const text = document.getElementById("tp_text");

const type = document.getElementById("tp_type");

const analytics = document.getElementById("tp_analytics");

const condition = document.getElementById("tp_condition");

let value = document.getElementById("tv_value");

const repeat = document.getElementById("tp_repeat");

const interval = document.getElementById("tp_interval");

const growth = document.getElementById("tp_growth");

const activeBtn = document.getElementById("activeBtn");

const impactBtn = document.getElementById("impactBtn");

const previewBtn = document.getElementById("previewBtn");

const progression = document.getElementById("progression");

previewBtn.onclick = () => {
  renderTip({
    tp_text: text.value,
    tp_type: type.value
  });
};
  
function getAnalyticsField() {
  return getAnalyticsFields()
    .find(x => x.value === analytics.value);
}

function updateAnalytics() {
  const field = getAnalyticsField();
  if (!field) return;
  analytics.title = field.description;
  condition.innerHTML = "";
  const conditions =
    field.type === "boolean"
      ? ["=", "!="]
      : [">", ">=", "=", "<=", "<", "!="];
  conditions.forEach(x => {
    const option =
      document.createElement("option");
    option.value = x;
    option.textContent = x;
    condition.appendChild(option);
  });
  condition.value =
    conditions.includes(tip.tp_condition)
      ? tip.tp_condition
      : conditions[0];
  const old = value;
  const parent = old.parentElement;
  if (field.type === "boolean") {
    const select =
      document.createElement("select");
    select.id = "tv_value";
    select.className = old.className;
    select.title = field.description;
    ["true", "false"].forEach(x => {
      const option =
        document.createElement("option");
      option.value = x;
      option.textContent = x;
      select.appendChild(option);
    });
    select.value =
      String(tip.tv_value || "true");
    old.replaceWith(select);
    value = select;
  } else {
    if (old.tagName !== "INPUT" ||
        old.type !== "number") {
      const input =
        document.createElement("input");
      input.id = "tv_value";
      input.className = old.className;
      input.type = "number";
      input.step = "1";
      input.value = old.value;
      old.replaceWith(input);
      value = input;
    }
    value.title = field.description;
    value.placeholder = "Value";
  }
  const numeric =
    field.type === "number";
  document.getElementById("progression")
    .hidden = !numeric;
  interval.disabled = !numeric;
  growth.disabled = !numeric;
  update();
}
  

/* TYPES */
getTipTypes().forEach(item => {
  const option = document.createElement("option");
  option.value = item.value;
  option.textContent = item.label;
  type.appendChild(option);
});

/* ANALYTICS */
getAnalyticsFields().forEach(field => {
  const option = document.createElement("option");
  option.value = field.value;
  option.textContent = field.label;
  option.title = field.description;
  analytics.appendChild(option);
});

/* LOAD */
async function init() {
  if (id && !isNew) {
    tip =
      await loadTip(id);
    document
      .getElementById("pageTitle")
      .textContent =
      "Edit Tip";
  }
  fill();
  updateAnalytics();
}

/* FILL */
function fill() {
  idTips.value = tip.id_tips || "";
  text.value = tip.tp_text || "";
  type.value = tip.tp_type || "bubble";
  analytics.value = tip.tp_analytics || "an_open";
  condition.value = tip.tp_condition || ">=";
  value.value = tip.tv_value ?? "";
  repeat.value = tip.tp_repeat ?? 1;
  interval.value = tip.tp_interval ?? 1;
  growth.value = tip.tp_growth ?? 1;
  updateActive();
  interval.title = "Number of views between two successive displays.";
  growth.title = "Multiplier applied to the current interval.";
  repeat.title = "Maximum number of displays. 0 = unlimited.";
  condition.title = "Condition applied to the selected analytics value.";
  text.title = "Text displayed to the user.";
}

function updateActive() {
  const on = tip.tp_active === true;
  activeBtn.className =
    "tool-btn " +
    (on ? "active-on" : "active-off");
  activeBtn.textContent = "●";
  activeBtn.title =
    on
      ? "Tip active"
      : "Tip inactive";
}

impactBtn.onclick = async () => {

  const box =
    document.getElementById("simulation");

  if (!box) return;

  box.innerHTML =
    "Calculating...";

  try {

    const result =
      await simulateTip({
        tp_analytics:
          analytics.value,
        tp_condition:
          condition.value,
        tv_value:
          value.value
      });

    box.innerHTML = `
      <div class="simulation-row">
        <span>Devices analyzed</span>
        <span class="simulation-value">
          ${result.total}
        </span>
      </div>

      <div class="simulation-row simulation-main">
        <span>Potentially involved</span>
        <span class="simulation-value">
          ${result.involved}
          (${result.percent}%)
        </span>
      </div>

      <div class="simulation-row">
        <span>Excluded</span>
        <span class="simulation-value">
          ${result.excluded}
        </span>
      </div>

      <div class="simulation-row">
        <span>Missing / unavailable data</span>
        <span class="simulation-value">
          ${result.missing}
        </span>
      </div>
    `;

  } catch(error) {

    console.error(error);

    box.innerHTML =
      "Simulation error.";
  }
};
  
activeBtn.onclick = () => {
  tip.tp_active =
    !tip.tp_active;
  updateActive();
};
  
/* UPDATE */
function update() {

  const field = getAnalyticsField();

  const box =
    document.getElementById("progression");

  box.innerHTML = "";
  box.hidden = !field;

  if (!field)
    return;

  const repeatValue =
    Number(repeat.value);

  if (field.type === "number") {

    const values =
      calculateProgression(
        interval.value,
        growth.value,
        repeat.value
      );

    values.forEach((value,index) => {

      const el =
        document.createElement("div");

      el.className = "step";

      el.textContent =
        `${index + 1}ª → ${value}`;

      box.appendChild(el);

    });

    if (repeatValue === 0) {

      const el =
        document.createElement("div");

      el.className = "step";
      el.textContent = "∞ → ...";

      box.appendChild(el);

    } else if (repeatValue > 10) {

      const el =
        document.createElement("div");

      el.className = "step";
      el.textContent = "11ª → ...";

      box.appendChild(el);
    }

  } else {

    const el =
      document.createElement("div");

    el.className = "step";
    el.textContent =
      "1ª → visualizzazione";

    box.appendChild(el);

    if (repeatValue === 0) {

      const el2 =
        document.createElement("div");

      el2.className = "step";
      el2.textContent = "∞ → ...";

      box.appendChild(el2);

    } else if (repeatValue > 1) {

      const el2 =
        document.createElement("div");

      el2.className = "step";

      el2.textContent =
        repeatValue > 10
          ? "11ª → ..."
          : `${repeatValue}ª → ...`;

      box.appendChild(el2);
    }
  }
}

/* EVENTS */
[
  text,
  type,
  analytics,
  condition,
  repeat,
  interval,
  growth
].forEach(el => {
  el.addEventListener(
    "input",
    update
  );
  el.addEventListener(
    "change",
    el === analytics
      ? updateAnalytics
      : update
  );
});

/* SAVE */
window.save = async () => {
  const id =
    idTips.value.trim();
  if (!id) {
    alert(
      "Enter the Tip ID."
    );
    return;
  }
  if (!text.value.trim()) {
    alert(
      "Enter the Tip text."
    );
    return;
  }
  const data = {
    id_tips: id,
    tp_text: text.value.trim(),
    tp_condition: condition.value,
    tp_analytics: analytics.value,
    tv_value: value.value.trim(),
    tp_type: type.value,
    tp_active: tip.tp_active === true,
    tp_repeat: Number(repeat.value),
    tp_interval: Number(interval.value),
    tp_growth: Number(growth.value)
  };
  try {
    await saveTip(data);
    location.href =
      "tips_overview.html";
  }
  catch(error) {
    console.error(error);
    alert(
      "Error while saving."
    );
  }
};

init();
</script>
</body>
</html>
