<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Tip</title>
<style>

body {
  font-family: Arial;
  background: #f6f8fb;
  margin: 0;
}

.header {
  display: flex;
  justify-content: center;
  padding: 10px;
}

.title {
  font-size: 24px;
  font-weight: bold;
  display: flex;
  gap: 20px;
  align-items: center;
}

.bck-btn,
.save-btn {
  width: 34px;
  height: 34px;
  border-radius: 17px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.bck-btn {
  background: #e5e7eb;
  color: #374151;
  font-size: 18px;
}

.save-btn {
  background: #22c55e;
  color: white;
  font-size: 18px;
}

.container {
  max-width: 900px;
  margin: 20px auto;
  padding: 20px;
  background: white;
  border-radius: 12px;
}

.row {
  display: flex;
  gap: 15px;
  margin-bottom: 15px;
}

.field {
  flex: 1;
}

label {
  display: block;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 5px;
}

input,
select,
textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 9px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-family: inherit;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.preview {
  margin-top: 25px;
  padding: 15px;
  background: #f6f8fb;
  border-radius: 10px;
}

.preview-title {
  font-weight: bold;
  margin-bottom: 10px;
}

.progression {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.step {
  background: #dbeafe;
  color: #1e3a8a;
  padding: 7px 12px;
  border-radius: 15px;
}

.tip-preview {
  margin-top: 20px;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}

.tip-bubble {
  background: #eff6ff;
  border: 1px solid #93c5fd;
}

.tip-banner {
  background: #fef3c7;
  border: 1px solid #f59e0b;
}

.tip-modal {
  background: white;
  border: 2px solid #6366f1;
  box-shadow: 0 5px 20px rgba(0,0,0,.15);
}

.tip-toast {
  background: #111827;
  color: white;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
}

.status input {
  width: auto;
}

</style>
</head>
<body>

<div class="header">
  <div class="title">
    <button
      class="bck-btn"
      onclick="location.href='tips_overview.html'">
      ←
    </button>
    <span id="pageTitle">
      Nuovo Tip
    </span>
    <button
      class="save-btn"
      onclick="save()">
      ✓
    </button>
  </div>
</div>
<div class="container">
  <div class="field">
    <label>ID Tip</label>
    <input
      id="id_tips"
      placeholder="es. welcome">
  </div>
  <br>
  <div class="field">
    <label>Testo</label>
    <textarea
      id="tp_text"
      placeholder="Testo del messaggio...">
    </textarea>
  </div>
  <div class="row">
    <div class="field">
      <label>Tipo</label>
      <select id="tp_type"></select>
    </div>
    <div class="field">
      <label>Analytics</label>
      <select id="tp_analytics"></select>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>Condizione</label>
      <select id="tp_condition">
        <option value="=">=</option>
        <option value="!=">!=</option>
        <option value=">">></option>
        <option value=">=">>=</option>
        <option value="<"><</option>
        <option value="<="><=</option>
      </select>
    </div>
    <div class="field">
      <label>Valore</label>
      <input
        id="tv_value"
        placeholder="es. 10 oppure true">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>Repeat</label>
      <input
        id="tp_repeat"
        type="number"
        min="0"
        value="1">
    </div>
    <div class="field">
      <label>Interval</label>
      <input
        id="tp_interval"
        type="number"
        min="1"
        value="1">
    </div>
    <div class="field">
      <label>Growth</label>
      <input
        id="tp_growth"
        type="number"
        step="0.1"
        value="1">
    </div>
  </div>
  <div class="status">
    <input
      id="tp_active"
      type="checkbox">
    <label
      for="tp_active">
      Tip attivo
    </label>
  </div>
  <div class="preview">
    <div class="preview-title">
      Progressione prevista
    </div>
    <div
      id="progression"
      class="progression">
    </div>
  </div>
  <div id="tipPreview"
       class="tip-preview tip-bubble">
    Anteprima del Tip
  </div>
</div>

<script type="module">

import {requireAuth} from "../pages/auth-check.js";

await requireAuth();

import {
  getTipTypes,
  getAnalyticsFields,
  calculateProgression,
  defaultTip,
  loadTip,
  saveTip
} from "./tips.js";


let tip = defaultTip();


const params = new URLSearchParams(location.search);

const id =params.get("id");
const isNew =params.get("new") === "1";

/* ELEMENTS */
const idTips = document.getElementById("id_tips");

const text = document.getElementById("tp_text");

const type = document.getElementById("tp_type");

const analytics = document.getElementById("tp_analytics");

const condition = document.getElementById("tp_condition");

let value = document.getElementById("tv_value");

const repeat = document.getElementById("tp_repeat");

const interval = document.getElementById("tp_interval");

const growth = document.getElementById("tp_growth");

const active = document.getElementById("tp_active");

function getAnalyticsField() {
  return getAnalyticsFields()
    .find(x => x.value === analytics.value);
}

function updateAnalytics() {
  const field = getAnalyticsField();
  if (!field) return;
  analytics.title = field.description;
  condition.innerHTML = "";
  const conditions =
    field.type === "boolean"
      ? ["=", "!="]
      : [">", ">=", "=", "<=", "<", "!="];
  conditions.forEach(x => {
    const option =
      document.createElement("option");
    option.value = x;
    option.textContent = x;
    condition.appendChild(option);
  });
  condition.value =
    conditions.includes(tip.tp_condition)
      ? tip.tp_condition
      : conditions[0];
  const old = value;
  const parent = old.parentElement;
  if (field.type === "boolean") {
    const select =
      document.createElement("select");
    select.id = "tv_value";
    select.className = old.className;
    select.title = field.description;
    ["true", "false"].forEach(x => {
      const option =
        document.createElement("option");
      option.value = x;
      option.textContent = x;
      select.appendChild(option);
    });
    select.value =
      String(tip.tv_value || "true");
    old.replaceWith(select);
    value = select;
  } else {
    if (old.tagName !== "INPUT" ||
        old.type !== "number") {
      const input =
        document.createElement("input");
      input.id = "tv_value";
      input.className = old.className;
      input.type = "number";
      input.step = "1";
      input.value = old.value;
      old.replaceWith(input);
      value = input;
    }
    value.title = field.description;
    value.placeholder = "Value";
  }
  const numeric =
    field.type === "number";
  document.getElementById("progression")
    .hidden = !numeric;
  interval.disabled = !numeric;
  growth.disabled = !numeric;
  update();
}
  

/* TYPES */
getTipTypes().forEach(item => {
  const option = document.createElement("option");
  option.value = item.value;
  option.textContent = item.label;
  type.appendChild(option);
});

/* ANALYTICS */
getAnalyticsFields().forEach(field => {
  const option = document.createElement("option");
  option.value = field;
  option.textContent = field;
  analytics.appendChild(option);
});

/* LOAD */
async function init() {
  if (id && !isNew) {
    tip =
      await loadTip(id);
    document
      .getElementById("pageTitle")
      .textContent =
      "Modifica Tip";
  }
  fill();
  updateAnalytics();
}

/* FILL */
function fill() {
  idTips.value = tip.id_tips || "";
  text.value = tip.tp_text || "";
  type.value = tip.tp_type || "bubble";
  analytics.value = tip.tp_analytics || "an_open";
  condition.value = tip.tp_condition || ">=";
  value.value = tip.tv_value ?? "";
  repeat.value = tip.tp_repeat ?? 1;
  interval.value = tip.tp_interval ?? 1;
  growth.value = tip.tp_growth ?? 1;
  active.checked = tip.tp_active === true;
  interval.title = "Number of views between two successive displays.";
  growth.title = "Multiplier applied to the current interval.";
  repeat.title = "Maximum number of displays. 0 = unlimited.";
  condition.title = "Condition applied to the selected analytics value.";
  text.title = "Text displayed to the user.";
}

/* UPDATE */
function update() {
  const field = getAnalyticsField();
  const numeric =
    field?.type === "number";
  const box =
    document.getElementById("progression");
  box.innerHTML = "";
  box.hidden = !numeric;
  if (numeric) {
    const values =
      calculateProgression(
        interval.value,
        growth.value,
        repeat.value
      );
    values.slice(0, 10)
      .forEach((value, index) => {
        const el =
          document.createElement("div");
        el.className = "step";
        el.textContent =
          `${index + 1}ª → ${value}`;
        box.appendChild(el);
      });
    if (Number(repeat.value) === 0) {
      const el =
        document.createElement("div");
      el.className = "step";
      el.textContent = "∞ → ...";
      box.appendChild(el);
    } else if (Number(repeat.value) > 10) {
      const el =
        document.createElement("div");
      el.className = "step";
      el.textContent = "11ª → ...";
      box.appendChild(el);
    }
  }
  const preview =
    document.getElementById("tipPreview");
  const tipType =
    getTipTypes()
      .find(x => x.value === type.value);
  preview.className =
    "tip-preview " +
    (tipType?.className || "tip-bubble");
  preview.textContent =
    text.value ||
    "Tip preview";
}

/* EVENTS */
[
  text,
  type,
  repeat,
  interval,
  growth
].forEach(el => {
  el.addEventListener(
    "input",
    update
  );
  el.addEventListener(
    "change",
    el === analytics
      ? updateAnalytics
      : update
  );
});

/* SAVE */
window.save = async () => {
  const id =
    idTips.value.trim();
  if (!id) {
    alert(
      "Inserire l'identificativo del Tip."
    );
    return;
  }
  if (!text.value.trim()) {
    alert(
      "Inserire il testo del Tip."
    );
    return;
  }

  const data = {
    id_tips: id,
    tp_text:
      text.value.trim(),
    tp_condition:
      condition.value,
    tp_analytics:
      analytics.value,
    tv_value:
      value.value.trim(),
    tp_type:
      type.value,
    tp_active:
      active.checked,
    tp_repeat:
      Number(repeat.value),
    tp_interval:
      Number(interval.value),
    tp_growth:
      Number(growth.value)
  };

  try {
    await saveTip(data);
    location.href =
      "tips_overview.html";
  }

  catch(error) {
    console.error(error);
    alert(
      "Errore durante il salvataggio."
    );
  }
};

init();
</script>
</body>
</html>
