<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>Tip</title>
<style>

body {
  font-family: Arial, sans-serif;
  background: #f6f8fb;
  margin: 0;
  color: #111827;
}

.header {
  display: flex;
  justify-content: center;
  padding: 10px;
}

.title {
  font-size: 24px;
  font-weight: bold;
  display: flex;
  gap: 20px;
  align-items: center;
}

.bck-btn,
.save-btn {
  width: 34px;
  height: 34px;
  border-radius: 17px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.bck-btn {
  background: #e5e7eb;
  color: #374151;
  font-size: 18px;
}

.save-btn {
  background: #22c55e;
  color: white;
  font-size: 18px;
}

.container {
  max-width: 900px;
  margin: 12px auto;
  padding: 20px;
  background: white;
  border-radius: 12px;
}

.row {
  display: flex;
  gap: 15px;
  margin-bottom: 10px;
}

.field {
  flex: 1;
  min-width: 0;
}

.tip-main-row {
  align-items: flex-end;
}

.tip-title-field {
  flex: 3;
}

.tip-icon-field {
  flex: 0 0 90px;
}

.tip-type-field {
  flex: 0 0 180px;
}
      
label {
  display: block;
  font-size: 12px;
  margin-bottom: 5px;
}

input,
select,
textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 6px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-family: inherit;
  background: #e6fbff;
}

input:disabled,
select:disabled {
  background: #f3f4f6;
  color: #9ca3af;
}

textarea:disabled {
  background: #f3f4f6;
  color: #9ca3af;
}

input:disabled,
select:disabled,
textarea:disabled {
  cursor: not-allowed;
}

input:disabled:hover,
select:disabled:hover,
textarea:disabled:hover {
  cursor: not-allowed;
}
      
textarea {
  min-height: 100px;
  resize: vertical;
}

.condition-row {
  align-items: flex-end;
}

.logic-inline-field {
  flex: 0 0 120px;
  min-width: 0;
}

.logic-inline-field label {
  display: block;
  font-size: 12px;
  margin-bottom: 5px;
}
      
.progression {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 8px;
  margin-top: 12px;
}

.step {
  min-width: 0;
  box-sizing: border-box;
  background: #dbeafe;
  color: #1e3a8a;
  padding: 7px 6px;
  border-radius: 15px;
  font-size: 13px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tip-tools {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px;
  margin-top: 12px;
}

.tool-btn {
  width: 34px;
  height: 34px;
  border-radius: 17px;
  border: none;
  cursor: pointer;
  color: white;
  font-size: 16px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
}

.impact-btn {
  background: #3b82f6;
}

.impact-btn:hover {
  background: #2563eb;
}

.preview-btn {
  background: #9333ea;
}

.preview-btn:hover {
  background: #7e22ce;
}

.active-on {
  background: #22c55e;
}

.active-on:hover {
  background: #16a34a;
}

.active-off {
  background: #ef4444;
}

.active-off:hover {
  background: #dc2626;
}

.estimated-summary {
  margin-top: 10px;
  padding: 8px 8px;
  background: #f3f4f6;
  border-radius: 8px;
  text-align: left;
}

.estimated-summary:empty {
  display: none;
}      
      
.simulation {
  margin-top: 10px;
  display: grid;
  gap: 4px;
}

.simulation-title {
  font-weight: bold;
  margin-bottom: 5px;
}

.simulation-row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 8px 8px;
  background: #f6f8fb;
  border-radius: 8px;
}

.simulation-value {
  font-weight: bold;
  text-align: right;
}

.simulation-main {
  background: #dcfce7;
  color: #166534;
}

.simulation-condition {
  background: #faf5ff;
  border-left: 4px solid #9333ea;
}

.simulation-logic {
  color: #9333ea;
  font-weight: bold;
  margin-right: 6px;
}

</style>
</head>
<body>
<div class="header">
  <div class="title">
<button class="bck-btn" onclick="location.href='tips_overview.html'">←</button>
<span id="pageTitle">New Tip</span>
<button class="save-btn" onclick="save()">✓</button>
  </div>
</div>
<div class="container">
<!-- TITLE / ICON / TYPE -->
<div class="row tip-main-row">
  <div class="field tip-title-field">
    <label>Title</label>
    <input id="tp_title" placeholder="Tip title">
  </div>
  <div class="field tip-icon-field">
    <label>Icon</label>
    <select id="tp_icon"></select>
  </div>
  <div class="field tip-type-field">
    <label>Type</label>
    <select id="tp_type"></select>
  </div>
</div>
  <!-- TEXT -->
  <div class="field">
<label>Text</label>
<textarea id="tp_text" placeholder="Message text..."></textarea>
  </div>
<!-- CONDITION 1 -->
<div class="row condition-row">
  <div class="field">
    <label>Analytics</label>
    <select id="tp_analytics_1"></select>
  </div>
  <div class="field">
    <label>Condition</label>
    <select id="tp_condition_1"></select>
  </div>
  <div class="field">
    <label>Value</label>
    <input id="tv_value_1" placeholder="Value">
  </div>
  <div class="logic-inline-field" id="logicRow1">
    <label>Logic</label>
    <select id="tp_logic_1">
      <option value="">--</option>
      <option value="AND">AND</option>
      <option value="OR">OR</option>
      <option value="NOT">NOT</option>
    </select>
  </div>
</div>
<!-- CONDITION 2 -->
<div id="conditionRow2" class="row condition-row">
  <div class="field">
    <label>Analytics</label>
    <select id="tp_analytics_2"></select>
  </div>
  <div class="field">
    <label>Condition</label>
    <select id="tp_condition_2"></select>
  </div>
  <div class="field">
    <label>Value</label>
    <input id="tv_value_2" placeholder="Value">
  </div>
  <div class="logic-inline-field" id="logicRow2">
    <label>Logic</label>
    <select id="tp_logic_2">
      <option value="">--</option>
      <option value="AND">AND</option>
      <option value="OR">OR</option>
      <option value="NOT">NOT</option>
    </select>
  </div>
</div>
<!-- CONDITION 3 -->
<div id="conditionRow3" class="row condition-row">
  <div class="field">
    <label>Analytics</label>
    <select id="tp_analytics_3"></select>
  </div>
  <div class="field">
    <label>Condition</label>
    <select id="tp_condition_3"></select>
  </div>
  <div class="field">
    <label>Value</label>
    <input id="tv_value_3" placeholder="Value">
  </div>
</div>
  <!-- REPEAT / INTERVAL / GROWTH -->
  <div class="row">
<div class="field">
  <label>Repeat</label>
  <input id="tp_repeat" type="number" min="0" value="1">
</div>
<div class="field">
  <label>Interval</label>
  <input id="tp_interval" type="number" min="1" value="1">
</div>
<div class="field">
  <label>Growth</label>
  <input id="tp_growth" type="number" step="0.1" value="1">
</div>
  </div>
  <!-- CTA -->
  <div class="row">
<div class="field">
  <label>Button</label>
  <select id="tp_cta_active">
    <option value="false">Disabled</option>
    <option value="true">Enabled</option>
  </select>
</div>
<div class="field">
  <label>Button label</label>
  <input id="tp_cta_label" placeholder="e.g. Scopri">
</div>
<div class="field">
  <label>Link</label>
  <input id="tp_cta_url" placeholder="https://...">
</div>
  </div>
  <!-- TOOLS -->
  <div class="tip-tools">
<button id="impactBtn" class="tool-btn impact-btn" type="button" title="Estimated Impact">↗</button>
<button id="activeBtn" class="tool-btn active-off" type="button" title="Tip inactive">●</button>
<button id="previewBtn" class="tool-btn preview-btn" type="button" title="Preview Tip">▶</button>
  </div>
  <!-- PROGRESSION -->
  <div id="progression" class="progression">
  </div>
  <!-- IMPACT -->
  <div id="estimatedSummary" class="estimated-summary"></div>    
  <div id="simulation" class="simulation">
  </div>
</div>

<script type="module">

import {requireAuth} from "../pages/auth-check.js";
await requireAuth();
import { TIP_ICONS, getTipTypes, getAnalyticsFields, getConditions, getTipOptions, getTipValueOptions, ANALYTICS_OPTIONS, calculateProgression, 
        defaultTip, loadTip, saveTip, simulateTip, renderTip } from "./tips.js";
let tip = defaultTip();
const params = new URLSearchParams(location.search);
const id = params.get("id");
const isNew = params.get("new") === "1";

/* ELEMENTS */
const type = document.getElementById("tp_type");
const icon = document.getElementById("tp_icon");
const title = document.getElementById("tp_title");
const text = document.getElementById("tp_text");
const activeBtn = document.getElementById("activeBtn");
const impactBtn = document.getElementById("impactBtn");
const previewBtn = document.getElementById("previewBtn");
const repeat = document.getElementById("tp_repeat");
const interval = document.getElementById("tp_interval");
const growth = document.getElementById("tp_growth");
const progression = document.getElementById("progression");
const simulation = document.getElementById("simulation");

/* CONDITION ELEMENTS */
const conditions = {
  1: {
    analytics: document.getElementById("tp_analytics_1"),
    condition: document.getElementById("tp_condition_1"),
    value: document.getElementById("tv_value_1")
  },
  2: {
    analytics: document.getElementById("tp_analytics_2"),
    condition: document.getElementById("tp_condition_2"),
    value: document.getElementById("tv_value_2")
  },
  3: {
    analytics: document.getElementById("tp_analytics_3"),
    condition: document.getElementById("tp_condition_3"),
    value: document.getElementById("tv_value_3")
  }
};

const logic1 = document.getElementById("tp_logic_1");
const logic2 = document.getElementById("tp_logic_2");

/* POPULATE ICONS */
TIP_ICONS.forEach(item => {
  const option = document.createElement("option");
  option.value = item;
  option.textContent = item;
  icon.appendChild(option);
});

/* POPULATE TYPES */
getTipTypes().forEach(item => {
  const option =  document.createElement("option");
  option.value = item.value;
  option.textContent = item.label;
  option.title = item.description;      
  type.appendChild(option);
});

/* POPULATE ANALYTICS */
function populateAnalytics(select) {
  select.innerHTML = "";
  const empty =  document.createElement("option");
  empty.value = "";
  empty.textContent = "--";
  select.appendChild(empty);
  getAnalyticsFields()
    .forEach(field => {
      const option = document.createElement("option");
      option.value = field.value;
      option.textContent = field.label;
      option.title = field.description;
      select.appendChild(option);
    });
}
Object.values(conditions)
  .forEach(item => {populateAnalytics(item.analytics);
  });
let tipOptions={platforms:[],entrances:[]};

async function loadTipOptions(){
tipOptions=await getTipOptions();
}
      
function updateConditionSelect(index) {
  const item = conditions[index];
  if (!item) return;
  const currentAnalytics = item.analytics.value;
  const currentCondition = item.condition.value;
  const currentValue = item.value.value;
  const field = getAnalyticsFields()
    .find(x => x.value === currentAnalytics);
  /* ANALYTICS NON SELEZIONATO */
  if (!field) {
    item.condition.innerHTML = "";
    item.condition.disabled = true;
    item.value.disabled = true;
    return;
  }
  /* CONDITIONS */
  const availableConditions = getConditions(field.type, currentAnalytics);
  item.condition.innerHTML = "";
  availableConditions.forEach(operator => {
    const option = document.createElement("option");
    option.value = operator;
    option.textContent = operator;
    item.condition.appendChild(option);
  });
  if (availableConditions.includes(currentCondition)) {item.condition.value = currentCondition;}
  else if (availableConditions.includes(tip[`tp_condition_${index}`])
  ) {item.condition.value = tip[`tp_condition_${index}`];}
  else {item.condition.value = availableConditions[0];}
  const selectedCondition = item.condition.value;
  /* NULL CONDITIONS
      IS NULL / IS NOT NULL non hanno bisogno di un valore. */
  if (selectedCondition === "IS NULL" || selectedCondition === "IS NOT NULL") {
    if (item.value.tagName !== "INPUT") {const input = document.createElement("input");
      input.id = `tv_value_${index}`;
      item.value.replaceWith(input);
      item.value = input;
    }
    item.value.type = "text";
    item.value.value = "";
    item.value.placeholder = "";
    item.value.disabled = true;
    return;
  }
  /* VALUE OPTIONS */
  const valueOptions = getTipValueOptions(currentAnalytics, tipOptions);
  if (valueOptions) {
    if (item.value.tagName !== "SELECT") {
      const select = document.createElement("select");
      select.id = `tv_value_${index}`;
      item.value.replaceWith(select);
      item.value = select;
      item.value.addEventListener("change", update);
    }
    item.value.innerHTML = "";
    const empty = document.createElement("option");
    empty.value = "";
    empty.textContent = "--";
    item.value.appendChild(empty);
    valueOptions.forEach(optionData => {
      const option = document.createElement("option");
      option.value = optionData.value;
      option.textContent = optionData.label;
      item.value.appendChild(option);
    });
    if ([...item.value.options] .some(option => option.value === currentValue)
    ) {item.value.value = currentValue;}
    else {item.value.value = "";}
    item.value.disabled = false;
    item.value.title = field.description;
    return;
  }
  /* GENERIC VALUE */
  if (item.value.tagName !== "INPUT") {
    const input = document.createElement("input");
    input.id = `tv_value_${index}`;
    item.value.replaceWith(input);
    item.value = input;
    item.value.addEventListener("input", update);
  }
  item.value.type = field.type === "string" ? "text" : "number";
  item.value.placeholder = "Value";
  item.value.value = currentValue;
  item.value.disabled = false;
  item.value.title = field.description;
}

/* CONDITION ROW VISIBILITY */
function setConditionEnabled(index, enabled) {
  const item = conditions[index];
  item.analytics.disabled = !enabled;
  item.condition.disabled = !enabled;
  item.value.disabled = !enabled;
  if (index === 1) {
    logic1.disabled = !enabled;
  }
  if (index === 2) {
    logic2.disabled = !enabled;
  }
  if (!enabled) {
    item.analytics.value = "";
    item.condition.value = "";
    item.value.value = "";
    if (index === 2) {
      logic2.value = "";
    }
  }
}

function updateLogicRows() {
  /* CONDITION 1
     Sempre completamente attiva. */
  setConditionEnabled(1, true);
  /* LOGIC 1
     Sempre disponibile perché appartiene alla Condition 1. */
  logic1.disabled = false;
  /* CONDITION 2
     Attiva solo se Logic 1 è valorizzata. */
  const condition2Enabled = !!logic1.value;
  setConditionEnabled(2, condition2Enabled);
  if (!condition2Enabled) {
    /* Se Condition 2 viene disattivata,
       anche Condition 3 deve essere azzerata. */
    setConditionEnabled(3, false);
    return;
  }
  /* CONDITION 3
     Attiva solo se Logic 2 è valorizzata. */
  const condition3Enabled = !!logic2.value;
  setConditionEnabled(3, condition3Enabled);
}

/* ACTIVE */
function updateActive() {
  const on = tip.tp_active === true;
  activeBtn.className = "tool-btn " +
    (on ? "active-on" : "active-off");
  activeBtn.textContent = "●";
  activeBtn.title = on ? "Tip active" : "Tip inactive";
}
activeBtn.onclick = () => {tip.tp_active = !tip.tp_active;
  updateActive();
};

/* PROGRESSION */
function updateProgression() {
  progression.innerHTML = "";
  const first = conditions[1];
  const field = getAnalyticsFields()
    .find(x => x.value === first.analytics.value);
  if (!field) {progression.hidden = true;return;}
  progression.hidden = false;
  const repeatValue = Number(repeat.value);
  /* REPEAT = 0 → infinite */
  if (repeatValue === 0) {
    if (field.type === "number") {
      const values = calculateProgression(
        interval.value,
        growth.value,
        10
      );
      values.forEach((value, index) => {
        const el = document.createElement("div");
        el.className = "step";
        el.textContent = `${index + 1}ª → ${value}`;
        progression.appendChild(el);
      });
    } else {
      for (let i = 1; i <= 10; i++) {
        const el = document.createElement("div");
        el.className = "step";
        el.textContent = `${i}ª → vis.`;
        progression.appendChild(el);
      }
    }
    const more = document.createElement("div");
    more.className = "step";
    more.textContent = "∞ → ...";
    progression.appendChild(more);
    return;
  }
  /* REPEAT > 0 → mostra tutte le progressioni fino a 10 */
  const visibleSteps = Math.min(repeatValue, 10);
  if (field.type === "number") {
    const values = calculateProgression(
      interval.value,
      growth.value,
      visibleSteps
    );
    values.forEach((value, index) => {
      const el = document.createElement("div");
      el.className = "step";
      el.textContent = `${index + 1}ª → ${value}`;
      progression.appendChild(el);
    });
  } else {
    for (let i = 1; i <= visibleSteps; i++) {
      const el = document.createElement("div");
      el.className = "step";
      el.textContent = `${i}ª → vis.`;
      progression.appendChild(el);
    }
  }
  /* Se le ripetizioni sono > 10, mostra More... */
  if (repeatValue > 10) {
    const more = document.createElement("div");
    more.className = "step";
    more.textContent = "More...";
    progression.appendChild(more);
  }
}

/* UPDATE */
function update() {
  updateConditionSelect(1);
  updateConditionSelect(2);
  updateConditionSelect(3);
  updateLogicRows();
  updateProgression();
}

/* EVENTS */
Object.values(conditions)
  .forEach(item => {item.analytics
      .addEventListener("change", () => {
      /* Quando cambia Analytics:
      - aggiorniamo gli operatori
      - aggiorniamo il campo Value
      - aggiorniamo la visibilità delle righe */
          updateConditionSelect(Number(item.analytics.id .split("_") .pop()));
          updateLogicRows();
          updateProgression();
        }
      );
    item.condition .addEventListener("change", update);
    item.value .addEventListener("input", update);
    item.value .addEventListener("change", update);
  });
logic1.addEventListener("change", update);
logic2.addEventListener("change", update);
repeat.addEventListener("input", updateProgression);
interval.addEventListener("input", updateProgression);
growth.addEventListener("input", updateProgression);

/* PREVIEW */
previewBtn.onclick = () => {renderTip({tp_type: type.value, tp_icon: icon.value, tp_title: title.value, tp_text: text.value, tp_repeat: Number(repeat.value),
    tp_cta_active: document.getElementById("tp_cta_active").value === "true", tp_cta_label: document.getElementById("tp_cta_label").value,
    tp_cta_url: document.getElementById("tp_cta_url").value});
};

/* IMPACT */
impactBtn.onclick =
  async () => {simulation.innerHTML = "Calculating...";
    try {
      const data = {
        tp_analytics_1: conditions[1] .analytics.value,
        tp_condition_1: conditions[1] .condition.value,
        tv_value_1: conditions[1] .value.value,
        tp_logic_1: logic1.value,
        tp_analytics_2: conditions[2] .analytics.value,
        tp_condition_2: conditions[2] .condition.value,
        tv_value_2: conditions[2] .value.value,
        tp_logic_2: logic2.value,
        tp_analytics_3: conditions[3] .analytics.value,
        tp_condition_3: conditions[3] .condition.value,
        tv_value_3: conditions[3] .value.value
      };
      const result = await simulateTip(data);
      let html = `
        <div class="simulation-row"><span>Devices analyzed</span>
          <span class="simulation-value">${result.total}</span>
        </div>
      `;
      result.detail
        .forEach(item => {
          html += `
            <div class="simulation-row simulation-condition">
              <span>
                ${item.logic ? `<span class="simulation-logic">(${item.logic})</span>` : ""}
                ${item.label}
                ${item.condition}
                ${item.value}
              </span>
            </div>
          `;
        });
      html += `
        <div class="simulation-row simulation-main">
          <span>Potentially involved</span>
          <span class="simulation-value">
            ${result.involved}
            (${result.percent}%)
          </span>
        </div>
        <div class="simulation-row">
          <span>Excluded</span>
          <span class="simulation-value">
            ${result.excluded}
          </span>
        </div>
        <div class="simulation-row">
          <span>Missing data</span>
          <span class="simulation-value">
            ${result.missing}
          </span>
        </div>
      `;
      simulation.innerHTML = html;
    } catch (error) { console.error(error);
      simulation.innerHTML = "Simulation error.";
    }
  };

function updateEstimatedSummary() {
  const summary = document.getElementById("estimatedSummary");
  if (!tip.tp_estimated_date || tip.tp_estimated === null || tip.tp_estimated === undefined) {
    summary.textContent = "";
    return;
  }
  const date = new Date(tip.tp_estimated_date + "T00:00:00");
  if (Number.isNaN(date.getTime())) {
    summary.textContent = "";
    return;
  }
  const formattedDate = date.toLocaleDateString("it-IT");
  summary.textContent =
    `Estimated Impact: ${formattedDate} = ${Number(tip.tp_estimated || 0)}`;
}

      
/* FILL */
function fill() {
  type.value = tip.tp_type || "bubble";
  icon.value = tip.tp_icon || TIP_ICONS[0];
  title.value = tip.tp_title || "";
  text.value = tip.tp_text || "";
  for (let i = 1; i <= 3; i++
  ) {conditions[i] .analytics.value = tip[`tp_analytics_${i}`] || "";
    conditions[i] .condition.value = tip[`tp_condition_${i}`] || ">=";
    conditions[i] .value.value = tip[`tv_value_${i}`] || "";}
  logic1.value = tip.tp_logic_1 ||"";
  logic2.value = tip.tp_logic_2 ||"";
  repeat.value = tip.tp_repeat ?? 1;
  interval.value = tip.tp_interval ?? 1;
  growth.value = tip.tp_growth ?? 1;
  document.getElementById("tp_cta_active").value = tip.tp_cta_active ? "true" : "false";
  document.getElementById("tp_cta_label").value = tip.tp_cta_label || "";
  document.getElementById("tp_cta_url").value = tip.tp_cta_url || "";
  updateActive();
  updateEstimatedSummary();
}

/* SAVE */
window.save =
  async () => {
    const data = {
      id_tips: tip.id_tips || null,          
      tp_type: type.value,
